# Configuration common to every environment. Secrets come from environment variables only.
spring:
  application:
    name: apv-backend
  datasource:
    url: ${APV_DATABASE_URL:jdbc:postgresql://localhost:5432/apv}
    username: ${APV_DATABASE_USER:apv}
    password: ${APV_DATABASE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Never wipe a database from the application.
    clean-disabled: true
  autoconfigure:
    exclude:
      # No built-in user and no generated password: accounts come only from the identity module.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      # No framework error page and no /error route: an error nothing else answered is given the
      # contract's body by the server's own error report (shared/ApiErrorReportValve).
      - org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
  session:
    jdbc:
      # The session tables are created by a Flyway migration, never by Spring Session itself.
      initialize-schema: never
  jackson:
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true

server:
  port: ${APV_PORT:8080}
  # Listen on this machine only unless told otherwise; a reverse proxy sits in front later.
  address: ${APV_BIND_ADDRESS:127.0.0.1}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

# Identity. Secrets come from the environment only; there are no defaults for them.
apv:
  identity:
    # Closed until the site can verify an email address (approved owner decision 1).
    registration-open: ${APV_REGISTRATION_OPEN:false}
    session-cookie:
      name: ${APV_SESSION_COOKIE_NAME:__Host-apv_session}
      secure: ${APV_SESSION_COOKIE_SECURE:true}
    # 32 random bytes each, Base64. Required outside the dev and test profiles.
    mfa-encryption-key: ${APV_MFA_ENCRYPTION_KEY:}
    hash-key: ${APV_HASH_KEY:}
    # Addresses of the reverse proxy whose X-Forwarded-For is believed. Empty: none.
    trusted-proxies: ${APV_TRUSTED_PROXIES:}
    # The site's own origin(s), when it differs from what the server sees. Empty: derived from the request.
    allowed-origins: ${APV_ALLOWED_ORIGINS:}
    argon2:
      # May be raised after measuring on the production machine; never below these.
      memory-kib: ${APV_ARGON2_MEMORY_KIB:19456}
      iterations: ${APV_ARGON2_ITERATIONS:2}
    hash-concurrency: ${APV_HASH_CONCURRENCY:4}
    # The comprehensive local breached-password list (docs/backend-password-blocklist.md).
    # Required outside the dev and test profiles: without a suitable one the application does not start.
    password-blocklist-path: ${APV_PASSWORD_BLOCKLIST_PATH:}
    # Optional: the SHA-256 recorded when that list was built. When set, a list whose manifest states another is refused.
    password-blocklist-sha256: ${APV_PASSWORD_BLOCKLIST_SHA256:}
  donations:
    # The private directory screenshots are stored in: on the persistent files volume, outside
    # anything the web server serves. Until it is set, gifts can be reported without a screenshot.
    evidence-root: ${APV_EVIDENCE_ROOT:}
    # The brakes of the whole site (contract/donation-lifecycle.md, 12.3). Never below one.
    brakes:
      reports-per-hour: ${APV_BRAKE_REPORTS_PER_HOUR:60}
      queue: ${APV_BRAKE_REPORT_QUEUE:300}
      evidence-bytes: ${APV_BRAKE_EVIDENCE_BYTES:2147483648}
      decodes: ${APV_BRAKE_DECODES:2}
