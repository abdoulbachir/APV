# Local development infrastructure for APV-GAKASINAY. Not a production deployment.
#
#   cp .env.example .env      (once)
#   docker compose up -d      start PostgreSQL
#   docker compose down       stop it, keep the data
#   docker compose down -v    stop it and delete the development data
name: apv-dev

services:
  postgres:
    # Keep equal to apv.postgres.image in backend/pom.xml.
    image: postgres:18.7
    environment:
      POSTGRES_DB: apv
      POSTGRES_USER: apv
      POSTGRES_PASSWORD: ${APV_DATABASE_PASSWORD:?Copy .env.example to .env first}
    ports:
      # Reachable from this machine only, never from the network.
      - "127.0.0.1:${APV_DATABASE_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql.
      - apv-dev-postgres:/var/lib/postgresql
      # Runs once, when the development database is first created: marks it disposable, which is
      # what allows fictional data and development accounts in it. Never used for a real database.
      - ./backend/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apv -d apv"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  apv-dev-postgres:
