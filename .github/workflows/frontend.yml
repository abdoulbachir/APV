name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Clean-checkout production build (no fictional data generated)
        run: |
          npm run build
          npm run test:production-build
          test ! -e contract/fixtures/dataset.json
          test ! -e contract/fixtures/dataset.public.json
          test ! -e src/api/dataset.public.json
      - run: npm test
      - name: Explicit fictional design preview
        run: |
          npm run build:mock
          node tests/check-production-build.mjs --mock
      - name: Real build even with local fixtures present
        run: |
          VITE_API_MODE=real npm run build
          npm run test:production-build
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/apv-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/apv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Enforced production CSP and intercepted identity browser journeys
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/apv-browser/node_modules/playwright/index.mjs
        run: node tests/identity-browser.mjs
      - run: npm audit
      - run: npm audit --omit=dev
