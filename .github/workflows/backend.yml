name: Backend checks
on:
  pull_request:
    paths:
      - backend/**
      - contract/**
      - compose.yaml
      - .github/workflows/backend.yml
  push:
    branches:
      - main
      - feature/m0b-public-read-backend
    paths:
      - backend/**
      - contract/**
      - compose.yaml
      - .github/workflows/backend.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node ../contract/tools/generate-dataset.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: backend/.java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unit tests, then integration tests against PostgreSQL started by Testcontainers.
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify backend artifact contains no fictional fixture payload
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('target/apv-backend-0.1.0-SNAPSHOT.jar') as jar:
              names = jar.namelist()
              app = [name for name in names if name.startswith('BOOT-INF/classes/') and not name.endswith('/')]
              assert app, 'Missing packaged application classes'
              for name in app:
                  assert not name.endswith(('dataset.json', 'dataset.public.json', 'example.json', 'example.public.json')), name
                  payload = jar.read(name)
                  for marker in (b'PRIVATE-REALNAME-', b'HELP-014', b'Sample household', b'Mariam D.', b'Nadia K.'):
                      assert marker not in payload, (name, marker)
              print('Packaged application classes/resources contain no fixture payload markers.')
          PY
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Backend tests"
            echo '```'
            grep -h "Tests run:" target/surefire-reports/*.txt target/failsafe-reports/*.txt 2>/dev/null || echo "no reports"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            line=$(grep -h "Tests run:" "$report" | head -1)
            echo "::notice title=$(basename "$report" .txt)::$line"
          done
      - name: Report failed tests
        if: failure()
        run: |
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            if grep -qE "FAILURE|ERROR" "$report"; then
              message=$(head -c 6000 "$report" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$(basename "$report" .txt)::$message"
            fi
          done
