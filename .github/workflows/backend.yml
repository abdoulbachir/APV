name: Backend checks
on:
  pull_request:
    paths:
      - backend/**
      - contract/**
      - compose.yaml
      - .github/workflows/backend.yml
  push:
    branches:
      - main
      - feature/m0b-public-read-backend
      - feature/m1b-identity-backend
    paths:
      - backend/**
      - contract/**
      - compose.yaml
      - .github/workflows/backend.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node ../contract/tools/generate-dataset.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: backend/.java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unit tests, then integration tests against PostgreSQL started by Testcontainers.
      - name: Build, unit tests and PostgreSQL integration tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee "$RUNNER_TEMP/maven.log"
      # Scenario 2.17: the password policy, its blocklist, hashing and verification, run again in a
      # network namespace that has no interface at all. The test first proves a connection fails.
      - name: Password checks with outgoing network disabled
        shell: bash
        run: |
          set +e
          # This run writes its own test reports; the reports of the full run above are kept as they are.
          cp -r target/surefire-reports "$RUNNER_TEMP/surefire-reports-full"
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "HOME=$HOME" \
            ./mvnw --offline --batch-mode --no-transfer-progress \
            -Dtest='IdentitySecurityUnitTest#a2_17_passwordChecksNeedNoNetwork,PasswordPolicyTest,BreachedPasswordsTest' \
            -Dapv.test.network-disabled=true -DargLine=-Dapv.test.network-disabled=true \
            surefire:test 2>&1 | tee "$RUNNER_TEMP/no-network.log"
          status=${PIPESTATUS[0]}
          rm -rf target/no-network-reports && mv target/surefire-reports target/no-network-reports
          mv "$RUNNER_TEMP/surefire-reports-full" target/surefire-reports
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -f target/identity-evidence/no-network.txt
      - name: Verify backend artifact contains no fictional fixture payload
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('target/apv-backend-0.1.0-SNAPSHOT.jar') as jar:
              names = jar.namelist()
              app = [name for name in names if name.startswith('BOOT-INF/classes/') and not name.endswith('/')]
              assert app, 'Missing packaged application classes'
              for name in app:
                  assert not name.endswith(('dataset.json', 'dataset.public.json', 'example.json', 'example.public.json')), name
                  payload = jar.read(name)
                  for marker in (b'PRIVATE-REALNAME-', b'HELP-014', b'Sample household', b'Mariam D.', b'Nadia K.'):
                      assert marker not in payload, (name, marker)
              print('Packaged application classes/resources contain no fixture payload markers.')
          PY
      # Milestone 1B, phase 1: compatibility probes for ADR 0002. A separate project, so the
      # accepted backend above is built and tested without any of the probe's dependencies.
      - name: Identity compatibility probes (PostgreSQL through Testcontainers)
        run: ./mvnw --batch-mode --no-transfer-progress -f probes/pom.xml verify
      - name: Probe evidence
        if: always()
        run: |
          {
            echo "### Identity compatibility probes"
            echo '```'
            cat probes/target/probe-results/*.txt 2>/dev/null || echo "no probe results"
            grep -h "Tests run:" probes/target/surefire-reports/*.txt probes/target/failsafe-reports/*.txt 2>/dev/null || echo "no probe reports"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for report in probes/target/surefire-reports/*.txt probes/target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            echo "::notice title=probe $(basename "$report" .txt)::$(grep -h "Tests run:" "$report" | head -1)"
          done
          for result in probes/target/probe-results/*.txt; do
            [ -f "$result" ] || continue
            message=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$result")
            echo "::notice title=probe $(basename "$result" .txt)::$message"
          done
      - name: Report failed probes
        if: failure()
        run: |
          for report in probes/target/surefire-reports/*.txt probes/target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            if grep -qE "FAILURE|ERROR" "$report"; then
              message=$(head -c 6000 "$report" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=probe $(basename "$report" .txt)::$message"
            fi
          done
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Backend tests"
            echo '```'
            grep -h "Tests run:" target/surefire-reports/*.txt target/failsafe-reports/*.txt 2>/dev/null || echo "no reports"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation with every class and the totals: annotations are capped at ten per step.
          python3 - <<'PY'
          import glob, re
          lines, totals = [], [0, 0, 0, 0]
          for kind in ('surefire', 'failsafe'):
              for path in sorted(glob.glob(f'target/{kind}-reports/*.txt')):
                  text = open(path, encoding='utf-8', errors='replace').read()
                  found = re.search(r'Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)', text)
                  if not found:
                      continue
                  numbers = [int(n) for n in found.groups()]
                  totals = [a + b for a, b in zip(totals, numbers)]
                  name = path.split('/')[-1][:-4].replace('org.apvgakasinay.', '')
                  lines.append(f'{kind[0]} {name}: {numbers[0]} run, {numbers[1]} failed, {numbers[2]} errors, {numbers[3]} skipped')
          rerun = [0, 0, 0, 0]
          for path in sorted(glob.glob('target/no-network-reports/*.txt')):
              found = re.search(r'Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)', open(path, encoding='utf-8', errors='replace').read())
              if found:
                  rerun = [a + b for a, b in zip(rerun, [int(n) for n in found.groups()])]
          lines.append(f'(separately, the network-disabled rerun of unit tests: {rerun[0]} run, {rerun[1]} failed, {rerun[2]} errors; not added to the total)')
          head = f'TOTAL {totals[0]} run, {totals[1]} failed, {totals[2]} errors, {totals[3]} skipped'
          print('::notice title=Backend test totals::' + '%0A'.join([head] + lines))
          PY
      - name: Identity evidence
        if: always()
        run: |
          for file in target/identity-evidence/*.txt; do
            [ -f "$file" ] || continue
            message=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$file")
            echo "::notice title=evidence $(basename "$file" .txt)::$message"
            { echo "### $(basename "$file" .txt)"; echo '```'; cat "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Report failed tests
        if: failure()
        run: |
          # What Maven itself reported, for failures that happen before any test report exists.
          if [ -f "$RUNNER_TEMP/no-network.log" ] && ! [ -f target/identity-evidence/no-network.txt ]; then
            message=$(grep -E "ERROR|FAIL|Tests run" "$RUNNER_TEMP/no-network.log" | grep -vE "^\[ERROR\]\s+at " | tail -n 40 | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=No-network run::$message"
          fi
          if [ -f "$RUNNER_TEMP/maven.log" ]; then
            message=$(grep -E "^\[ERROR\]|BUILD|Tests run:.*Fail" "$RUNNER_TEMP/maven.log" | grep -vE "^\[ERROR\]\s+at " | tail -n 60 | head -c 12000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Maven output::$message"
          fi
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            if grep -qE "FAILURE|ERROR" "$report"; then
              # The failures and their messages, without stack frames.
              message=$(grep -vE "^\s+at |^\s+\.\.\. [0-9]+ more" "$report" | head -c 14000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$(basename "$report" .txt)::$message"
            fi
          done
