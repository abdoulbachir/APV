  /donations:
    post:
      tags: [Giving]
      operationId: reportDonation
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      x-returns-credential: true
      x-idempotent: true
      summary: Report a gift that was paid outside the site.
      description: |
        No account is needed. The gift is recorded as `reported` and changes nothing public:
        no total, no list and no count, until a super administrator has verified that the
        money was received and confirms it.

        The answer is the receipt: the reference, the tracking code (shown once) and the
        token that allows one screenshot to be attached within 30 minutes.

        `Idempotency-Key` is required. The same key with the same body returns the first
        answer again, tracking code included, and records nothing more; the same key with
        another body is 409 `idempotency_key_reused`. Generate the key at random when the form
        is opened and keep it with the form.

        Refusals: 400 for an invalid body (an unknown or draft case is field `caseCode`,
        `invalid_value`; text that is a payment card number is `card_number`); 409
        `case_not_accepting` when the case does not take gifts now; 409
        `payment_details_changed` when the recipient details shown were replaced 24 hours ago
        or more; 503 `reporting_paused` when the site is holding back reports.

        When the session is fully signed in, the gift is linked to that account. It is never
        linked because an address or a name matches.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationReportRequest' }
            example:
              caseCode: HELP-014
              amount: 5000
              paymentDetailsId: pmd_Hq3Zr8Kd5Wm2Xt7Lp9Vb4N
              paidOn: '2026-11-26'
              payerName: Sample Donor
              paymentReference: ZL-48213907
              display: { mode: named, publicName: Sample D. }
      responses:
        '201':
          description: The report is recorded. The tracking code and the upload token are shown only here. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonationReceipt' }
              example:
                reference: 7K4M-2QXD
                trackingCode: 7K4M-2QXD-9FTR-C3VZ-H8NW
                state: reported
                caseCode: HELP-014
                amount: 5000
                reportedAt: '2026-11-26T15:04:05Z'
                evidenceUpload:
                  token: f3Kq9ZxT1mB7vLw2RnC8yPd4HsJ6uGa0EoXiVtY5QkM
                  expiresAt: '2026-11-26T15:34:05Z'
                  maxBytes: 5242880
                  formats: [image/jpeg, image/png]
        '400': { $ref: '#/components/responses/GivingValidationError' }
        '403': { $ref: '#/components/responses/GivingForbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
