        is kept, without any of the data the file carried. It is private: no public route and
        no donor can read it, the uploader included.

        A screenshot is supporting evidence, not proof of receipt. It never confirms a gift.

        A refusal leaves the gift as it was, reported and without evidence. 400
        `evidence_token_invalid` for a token that is wrong, expired, used, or whose gift is no
        longer `reported`: the four look the same. 400 `evidence_invalid` when the content is
