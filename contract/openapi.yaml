    PublicDonor:
      x-audience: public
      type: object
      additionalProperties: false
      required: [id, name, amount, date, avatarUrl]
      properties:
        id:
          description: Opaque identifier of the listing. Not an account identifier.
          type: string
        name:
          description: Null for an anonymous donation.
          type: [string, 'null']
        amount:
          description: |
            Net amount of the donation: the confirmed amount minus every refund and reversal
            recorded against it. A donation whose net amount is zero is not listed.
          $ref: '#/components/schemas/MovementCents'
        date:
          description: Date of the original donation. Later corrections do not change it.
          $ref: '#/components/schemas/Timestamp'
        avatarUrl:
          description: |
            Null unless the donation is named and the donor has agreed to public display of their
            picture. Always null for an anonymous donation.
          oneOf:
            - $ref: '#/components/schemas/MediaPath'
            - type: 'null'
    LedgerKind:
      x-audience: public
      description: |
        Four original kinds and five correction kinds. A correction always points at exactly
        one original entry of the kind shown.

        | Kind | Effect | Corrects |
        |---|---|---|
        | `donation` | allocated + | |
        | `transfer_in` | allocated + | |
        | `transfer_out` | allocated - | |
        | `disbursement` | delivered + | |
        | `donation_reversal` | allocated - | a `donation` recorded in error |
        | `refund` | allocated - | a `donation` whose money went back to the donor |
        | `transfer_in_reversal` | allocated - | a `transfer_in` |
        | `transfer_out_reversal` | allocated + | a `transfer_out` |
        | `disbursement_reversal` | delivered - | a `disbursement` |
      type: string
      enum:
        - donation
        - donation_reversal
        - refund
        - transfer_in
        - transfer_out
        - transfer_in_reversal
        - transfer_out_reversal
        - disbursement
        - disbursement_reversal
    LedgerEntry:
      x-audience: public
      description: |
        One movement of money on one case. See `contract/financial-terms.md` section 2 for the
        correction rules.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - amount
        - allocatedDelta
        - deliveredDelta
        - date
        - label
        - corrects
        - correctedBy
        - correctedAmount
        - netAmount
        - counterpartCaseCode
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/LedgerKind' }
        amount:
          description: Always positive. The direction is given by `kind` and by the two deltas.
          $ref: '#/components/schemas/MovementCents'
        allocatedDelta:
          description: Signed change to the case's `received`.
          $ref: '#/components/schemas/SignedCents'
        deliveredDelta:
          description: Signed change to the case's `delivered`.
          $ref: '#/components/schemas/SignedCents'
        date:
          description: When the movement took effect.
          $ref: '#/components/schemas/Timestamp'
        label:
          description: Localized, ready to display. Never contains a donor name.
          type: string
        corrects:
          description: |
            Identifier of the original entry this one corrects. Set on the five correction
            kinds, null on the four original kinds. The original is always on the same case.
          type: [string, 'null']
        correctedBy:
          description: |
            Identifiers of every entry that corrects this one, oldest first. Empty when there
            is none. Always empty on a correction entry, because a correction cannot itself be
            corrected.
          type: array
          items: { type: string }
        correctedAmount:
          description: |
            Sum of the amounts of the entries in `correctedBy`. Never more than `amount`. The
            entry is partly corrected when this is between zero and `amount`, and fully
            corrected when it equals `amount`.
          $ref: '#/components/schemas/Cents'
        netAmount:
          description: '`amount` minus `correctedAmount`. What still stands of this movement.'
          $ref: '#/components/schemas/Cents'
        counterpartCaseCode:
          description: |
            On the four transfer kinds, the code of the case or fund at the other end. Null on
            every other kind. The other end is always public, because no money can move to or
            from a draft case.
          type: [string, 'null']
