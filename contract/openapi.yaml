openapi: 3.1.0
info:
  title: APV-GAKASINAY API
  version: 0.1.0
  summary: Public read endpoints (milestone 0).
  description: |
    Single source of truth for the API between the APV-GAKASINAY frontend and backend.

    Every endpoint in this version is public and needs no authentication, which is what the
    empty root `security` list states. Later versions declare a session scheme and set it on
    each protected operation.

    This version covers the public read endpoints only. Write endpoints, authentication,
    administration, uploads and profiles are added in later milestones through their own
    contract pull requests.

    ## Conventions

    - **Base path.** Every path is relative to `/api`. Frontend and API are served from one origin.
    - **Money.** Integer US cents. Never a decimal, never a string. Every value fits in a
      JavaScript safe integer. See `contract/financial-terms.md` for the exact meaning of each field.
    - **Timestamps.** RFC 3339 in UTC with a `Z` suffix, for example `2026-11-21T12:00:00Z`.
    - **Date-only values.** `YYYY-MM-DD` with no time and no zone. Only `deadline` uses this.
      It is a calendar day in the organization timezone published by `GET /site`.
    - **Language.** Send `Accept-Language`. Supported languages are `en` and `fr`.
      The response carries `Content-Language` and `Vary: Accept-Language`.
      See the `AcceptLanguage` parameter for the fallback rules.
    - **Errors.** Every error uses the `Error` schema. Clients decide what to show from
      `error.code`. `error.message` is English text for developers.
    - **Privacy.** Schemas in this file are public. They never contain draft cases, private
      beneficiary details, hidden donors, or names and pictures of anonymous donors.
    - **Unknown values.** Clients must ignore unknown object properties and must not fail on an
      unknown `LedgerKind`; use `allocatedDelta` and `deliveredDelta` to compute totals.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin as the frontend.
security: []
tags:
  - name: Site
    description: Settings and platform-wide totals.
  - name: Cases
    description: The public case directory, single cases and the general fund.
  - name: Case history
    description: Paginated updates, donors and ledger entries of one case.
paths:
  /site:
    get:
      tags: [Site]
      operationId: getSite
      summary: Site settings the frontend needs to display data correctly.
      responses:
        '200':
          description: Site settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
              example:
                timezone: America/New_York
                currency: USD
                locales: [en, fr]
                defaultLocale: en
                categories: [education, medical, housing, family, emergency, other]
                fundCode: FUND
                pagination: { defaultPageSize: 12, maxPageSize: 48 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /stats:
    get:
      tags: [Site]
      operationId: getStats
      summary: Platform-wide totals.
      description: |
        Internal transfers between cases and the general fund never change these numbers.
      responses:
        '200':
          description: Platform totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
              example:
                received: 2847500
                delivered: 2312000
                available: 535500
                peopleHelped: 18
                asOf: '2026-11-24T12:00:00Z'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: Search, filter, sort and page through public cases.
      description: |
        Returns cases of kind `case` only. The general fund is never in this list; read it with
        `GET /cases/FUND`. Draft cases are never returned.

        ## Status groups

        - `active` returns cases whose status is `active` or `funded`.
        - `completed` returns cases whose status is `delivered` or `closed`.

        ## Search (`q`)

        Both the query and the searched fields are normalized the same way:

        1. Unicode NFD decomposition.
        2. Remove code points U+0300 to U+036F (combining marks).
        3. Lower-case.
        4. Trim leading and trailing white space.

        A case matches when the normalized query is a substring of at least one of: the English
        title, the French title, the public name, the case code. Both languages are searched
        whatever `Accept-Language` says. Category labels are not searched; use `category`.
        A query that is empty after trimming applies no filter. No other folding is applied
        (for example `œ` does not match `oe`), so the mock and the real API behave identically.

        ## Sorting

        Every sort ends with the same tie-breakers: `createdAt` descending, then `code` ascending.
        The funding ratio is `max(received, 0) / goal`. Ratios are compared exactly, by integer
        cross-multiplication, never with floating point.

        | `sort` | Order |
        |---|---|
        | `newest` | `createdAt` descending. |
        | `deadline` | `deadline` ascending. Cases with no deadline last. |
        | `closest` | First, cases with a goal that are below it, ratio descending. Then cases at or above their goal, ratio ascending. Then cases with no goal. |
        | `least` | Cases with a goal, ratio ascending. Then cases with no goal. |
        | `featured` | `featuredRank` ascending. Cases with no rank last, in `newest` order. |

        ## Paging

        A `page` beyond the last page is not an error: it returns an empty `items` array with the
        correct totals.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          schema: { type: string, enum: [active, completed], default: active }
        - name: q
          in: query
          description: Search text. At most 80 characters after trimming.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          description: Omit for all categories.
          schema: { $ref: '#/components/schemas/Category' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, deadline, closest, least, featured], default: newest }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of cases.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePage' }
              example:
                items:
                  - code: HELP-014
                    kind: case
                    status: active
                    category: housing
                    featuredRank: 1
                    title: A safe home for a family of five
                    publicName: Mariam D.
                    story: "After a fire, Mariam and her children need help with a deposit and first month of rent."
                    language: en
                    photoUrl: null
                    photoThumbnailUrl: null
                    photoAlt: null
                    goal: 850000
                    received: 567500
                    delivered: 320000
                    deadline: '2027-01-18'
                    deadlineEndsAt: '2027-01-19T05:00:00Z'
                    createdAt: '2026-10-04T15:00:00Z'
                page: 1
                pageSize: 12
                totalItems: 200
                totalPages: 17
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}:
    get:
      tags: [Cases]
      operationId: getCase
      summary: One public case, or the general fund, with previews of its history.
      description: |
        `updates`, `donors` and `ledger` hold the 10 newest entries of each. `counts` holds the
        full number of entries. Older entries are read from the three history endpoints, so the
        complete financial record of a case is always reachable.

        A draft case, or a code that does not exist, returns 404 `case_not_found`. The two are
        indistinguishable on purpose.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The case.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
              example:
                case:
                  code: HELP-901
                  kind: case
                  status: active
                  category: education
                  featuredRank: 1
                  title: School supplies for a new term
                  publicName: Sample household A
                  story: Fictional sample story.
                  language: en
                  photoUrl: /media/public/3f9a1c/display.webp
                  photoThumbnailUrl: /media/public/3f9a1c/thumb.webp
                  photoAlt: Symbolic artwork of a school bag
                  goal: 100000
                  received: 46000
                  delivered: 30000
                  deadline: '2027-01-18'
                  deadlineEndsAt: '2027-01-19T05:00:00Z'
                  createdAt: '2026-10-04T15:00:00Z'
                financials:
                  externalDonations: 31000
                  transfersIn: 15000
                  transfersOut: 0
                  allocated: 46000
                  delivered: 30000
                  available: 16000
                  hasShortfall: false
                photos:
                  - id: photo-1
                    url: /media/public/7b2e44/display.webp
                    thumbnailUrl: /media/public/7b2e44/thumb.webp
                    alt: Symbolic artwork of notebooks
                    position: 1
                updates:
                  - id: U1
                    caseCode: HELP-901
                    text: Sample update written in English only.
                    language: en
                    photoUrl: null
                    date: '2026-11-19T17:30:00Z'
                    author: Sample Admin
                    authorAvatarUrl: null
                donors:
                  - { id: D3, name: null, amount: 6000, date: '2026-11-06T12:00:00Z', avatarUrl: null }
                  - { id: D2, name: Sample Donor Two, amount: 20000, date: '2026-11-05T12:00:00Z', avatarUrl: null }
                ledger:
                  - { id: L8, kind: refund, amount: 4000, allocatedDelta: -4000, deliveredDelta: 0, date: '2026-11-10T12:00:00Z', label: Refund to donor, reverses: L3, reversedBy: null }
                  - { id: L7, kind: disbursement, amount: 30000, allocatedDelta: 0, deliveredDelta: 30000, date: '2026-11-09T12:00:00Z', label: Delivered to the beneficiary, reverses: null, reversedBy: null }
                  - { id: L6, kind: transfer_in, amount: 15000, allocatedDelta: 15000, deliveredDelta: 0, date: '2026-11-08T12:00:00Z', label: Transfer received, reverses: null, reversedBy: null }
                  - { id: L4, kind: donation, amount: 5000, allocatedDelta: 5000, deliveredDelta: 0, date: '2026-11-07T12:00:00Z', label: Confirmed gift, reverses: null, reversedBy: null }
                  - { id: L3, kind: donation, amount: 10000, allocatedDelta: 10000, deliveredDelta: 0, date: '2026-11-06T12:00:00Z', label: Confirmed gift, reverses: null, reversedBy: L8 }
                  - { id: L2, kind: donation, amount: 20000, allocatedDelta: 20000, deliveredDelta: 0, date: '2026-11-05T12:00:00Z', label: Confirmed gift, reverses: null, reversedBy: null }
                counts: { updates: 1, donors: 2, ledger: 6, photos: 1 }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/updates:
    get:
      tags: [Case history]
      operationId: listCaseUpdates
      summary: Updates posted on a case, newest first.
      description: Ordered by `date` descending, then `id` descending.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of updates.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseUpdatePage' }
              example:
                items:
                  - id: U1
                    caseCode: HELP-901
                    text: Sample update written in English only.
                    language: en
                    photoUrl: null
                    date: '2026-11-19T17:30:00Z'
                    author: Sample Admin
                    authorAvatarUrl: null
                page: 1
                pageSize: 12
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/donors:
    get:
      tags: [Case history]
      operationId: listCaseDonors
      summary: Publicly listed donors of a case, newest first.
      description: |
        Contains confirmed donations whose visibility is `named` or `anonymous` and whose net
        amount is above zero. Donations with visibility `hidden` are never listed. Ordered by
        `date` descending, then `id` descending.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of donors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDonorPage' }
              example:
                items:
                  - { id: D3, name: null, amount: 6000, date: '2026-11-06T12:00:00Z', avatarUrl: null }
                  - { id: D2, name: Sample Donor Two, amount: 20000, date: '2026-11-05T12:00:00Z', avatarUrl: null }
                page: 1
                pageSize: 12
                totalItems: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/ledger:
    get:
      tags: [Case history]
      operationId: listCaseLedger
      summary: Every financial movement of a case, newest first.
      description: |
        The complete public financial record. Entries are never edited or removed; a correction
        is a new entry that points at the one it corrects. Ordered by `date` descending, then
        `id` descending.

        For any case, over all pages:

        - the sum of `allocatedDelta` equals `Case.received`;
        - the sum of `deliveredDelta` equals `Case.delivered`.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of ledger entries.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryPage' }
              example:
                items:
                  - { id: L8, kind: refund, amount: 4000, allocatedDelta: -4000, deliveredDelta: 0, date: '2026-11-10T12:00:00Z', label: Refund to donor, reverses: L3, reversedBy: null }
                  - { id: L7, kind: disbursement, amount: 30000, allocatedDelta: 0, deliveredDelta: 30000, date: '2026-11-09T12:00:00Z', label: Delivered to the beneficiary, reverses: null, reversedBy: null }
                page: 1
                pageSize: 2
                totalItems: 6
                totalPages: 3
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: |
        Preferred language. The server picks the first supported language (`en` or `fr`) in the
        header, honoring quality values and ignoring region subtags (`fr-CA` is `fr`). A missing
        header, or one with no supported language, means `en`.

        Field fallback: when a localized field has no text in the chosen language, the other
        language is returned for that field. Objects that can fall back carry a `language`
        property naming the language actually returned, so the client can set the HTML `lang`
        attribute. Personal names are never translated.
      schema: { type: string, default: en }
      example: fr
    CaseCode:
      name: code
      in: path
      required: true
      description: |
        Case code. Matched case-insensitively. Responses always carry the canonical upper-case
        code. `FUND` is the general fund.
      schema: { type: string, pattern: '^[A-Za-z]{2,8}(-[0-9]{1,6})?$', maxLength: 16 }
      example: HELP-014
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
  headers:
    ContentLanguage:
      description: The language chosen for the response, `en` or `fr`.
      schema: { $ref: '#/components/schemas/Locale' }
    Vary:
      description: Always includes `Accept-Language` on localized responses.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
  responses:
    ValidationError:
      description: A query parameter is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: pageSize must be between 1 and 48
              fields: [{ name: pageSize, code: out_of_range }]
              requestId: 5f0c1c9e2b7a4d1f
    CaseNotFound:
      description: No public case has this code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: case_not_found, message: Case not found, requestId: 5f0c1c9e2b7a4d1f }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Too many requests, requestId: 5f0c1c9e2b7a4d1f }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal_error, message: Unexpected error, requestId: 5f0c1c9e2b7a4d1f }
    Unavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unavailable, message: Service unavailable, requestId: 5f0c1c9e2b7a4d1f }
  schemas:
    Cents:
      description: A non-negative amount in integer US cents.
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    PositiveCents:
      description: A strictly positive amount in integer US cents.
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    SignedCents:
      description: |
        An amount in integer US cents that can be negative. Negative values appear only in the
        exceptional shortfall situation described in `contract/financial-terms.md`.
      type: integer
      format: int64
      minimum: -9007199254740991
      maximum: 9007199254740991
    Locale:
      type: string
      enum: [en, fr]
    Category:
      type: string
      enum: [education, medical, housing, family, emergency, other]
    CaseKind:
      type: string
      enum: [case, fund]
    PublicCaseStatus:
      description: Public statuses. `draft` exists only in administration schemas.
      type: string
      enum: [active, funded, delivered, closed]
    ErrorCode:
      description: |
        Codes used by the endpoints in this version. Later milestones add codes; clients must
        treat an unknown code as a generic failure for its HTTP status.
      type: string
      enum: [validation_error, case_not_found, not_found, rate_limited, internal_error, unavailable]
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              description: English text for developers. Not for display.
              type: string
            fields:
              description: Present on `validation_error`.
              type: array
              items:
                type: object
                required: [name, code]
                properties:
                  name: { type: string }
                  code:
                    type: string
                    enum: [required, invalid_type, invalid_value, out_of_range, too_long]
            requestId:
              description: Identifier to quote when reporting a problem.
              type: string
    Site:
      type: object
      required: [timezone, currency, locales, defaultLocale, categories, fundCode, pagination]
      properties:
        timezone:
          description: IANA name of the organization timezone. Deadlines are days in this zone.
          type: string
        currency: { type: string, const: USD }
        locales:
          type: array
          items: { $ref: '#/components/schemas/Locale' }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
        categories:
          description: Every category, in display order.
          type: array
          items: { $ref: '#/components/schemas/Category' }
        fundCode: { type: string, const: FUND }
        pagination:
          type: object
          required: [defaultPageSize, maxPageSize]
          properties:
            defaultPageSize: { type: integer }
            maxPageSize: { type: integer }
    Stats:
      type: object
      required: [received, delivered, available, peopleHelped, asOf]
      properties:
        received:
          description: |
            Net external donations to the whole platform: confirmed donations minus donation
            reversals and refunds. Internal transfers are not counted.
          $ref: '#/components/schemas/Cents'
        delivered:
          description: Net money handed to beneficiaries, disbursements minus disbursement reversals.
          $ref: '#/components/schemas/Cents'
        available:
          description: '`received` minus `delivered`.'
          $ref: '#/components/schemas/SignedCents'
        peopleHelped:
          description: Number of cases of kind `case` whose `delivered` is above zero.
          type: integer
          minimum: 0
        asOf:
          type: string
          format: date-time
    Case:
      description: Public view of a case or of the general fund.
      type: object
      required:
        - code
        - kind
        - status
        - category
        - featuredRank
        - title
        - publicName
        - story
        - language
        - photoUrl
        - photoThumbnailUrl
        - photoAlt
        - goal
        - received
        - delivered
        - deadline
        - deadlineEndsAt
        - createdAt
      properties:
        code:
          description: Canonical upper-case code. `FUND` for the general fund.
          type: string
        kind: { $ref: '#/components/schemas/CaseKind' }
        status: { $ref: '#/components/schemas/PublicCaseStatus' }
        category:
          description: Always set for kind `case`. Always null for the fund.
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        featuredRank:
          description: Lower shows first. Null when not featured. Unique among public cases.
          type: [integer, 'null']
          minimum: 1
        title:
          description: Localized.
          type: string
        publicName:
          description: The name the person agreed to show. Never translated. Empty for the fund.
          type: string
        story:
          description: Localized plain text. Paragraphs are separated by a blank line.
          type: string
        language:
          description: Language of `title` and `story` as returned.
          $ref: '#/components/schemas/Locale'
        photoUrl:
          description: Main picture at display size. Same-origin path or absolute URL.
          type: [string, 'null']
        photoThumbnailUrl:
          description: Main picture at card size.
          type: [string, 'null']
        photoAlt:
          description: Localized description of the main picture. Null when there is no picture.
          type: [string, 'null']
        goal:
          description: Null for the fund and for cases with no goal. Never zero.
          oneOf:
            - $ref: '#/components/schemas/PositiveCents'
            - type: 'null'
        received:
          description: |
            Net funds allocated to this case: external donations plus transfers in minus
            transfers out, each net of corrections. Equal to `financials.allocated`.
          $ref: '#/components/schemas/SignedCents'
        delivered:
          description: Net money handed over from this case.
          $ref: '#/components/schemas/Cents'
        deadline:
          description: |
            Last calendar day of the appeal, inclusive, in the organization timezone.
            Date only. Format it without any timezone conversion.
          type: [string, 'null']
          format: date
        deadlineEndsAt:
          description: |
            The first instant after the deadline day in the organization timezone (exclusive end).
            Null when `deadline` is null.
          type: [string, 'null']
          format: date-time
        createdAt:
          description: When the case was first published.
          type: string
          format: date-time
    CaseFinancials:
      description: |
        Breakdown of a case's money. `allocated = externalDonations + transfersIn - transfersOut`
        and `available = allocated - delivered` always hold.
      type: object
      required: [externalDonations, transfersIn, transfersOut, allocated, delivered, available, hasShortfall]
      properties:
        externalDonations:
          description: Confirmed donations to this case, minus donation reversals and refunds.
          $ref: '#/components/schemas/Cents'
        transfersIn:
          description: Money moved into this case from other cases or the fund, net of reversed transfers.
          $ref: '#/components/schemas/Cents'
        transfersOut:
          description: Money moved out of this case, net of reversed transfers.
          $ref: '#/components/schemas/Cents'
        allocated: { $ref: '#/components/schemas/SignedCents' }
        delivered: { $ref: '#/components/schemas/Cents' }
        available: { $ref: '#/components/schemas/SignedCents' }
        hasShortfall:
          description: True when `available` is negative.
          type: boolean
    CasePhoto:
      description: An additional public picture of a case.
      type: object
      required: [id, url, thumbnailUrl, alt, position]
      properties:
        id: { type: string }
        url:
          description: Display size.
          type: string
        thumbnailUrl: { type: string }
        alt:
          description: Localized description for screen readers.
          type: string
        position:
          description: 1-based display order.
          type: integer
          minimum: 1
    CaseUpdate:
      type: object
      required: [id, caseCode, text, language, photoUrl, date, author, authorAvatarUrl]
      properties:
        id: { type: string }
        caseCode: { type: string }
        text:
          description: Localized plain text.
          type: string
        language: { $ref: '#/components/schemas/Locale' }
        photoUrl: { type: [string, 'null'] }
        date: { type: string, format: date-time }
        author:
          description: Display name of the administrator who posted it.
          type: string
        authorAvatarUrl:
          description: Null unless the author allows public display of their picture.
          type: [string, 'null']
    PublicDonor:
      type: object
      required: [id, name, amount, date, avatarUrl]
      properties:
        id:
          description: Opaque identifier of the listing. Not an account identifier.
          type: string
        name:
          description: Null for an anonymous donation.
          type: [string, 'null']
        amount:
          description: Net confirmed amount of the donation.
          $ref: '#/components/schemas/PositiveCents'
        date: { type: string, format: date-time }
        avatarUrl:
          description: |
            Null unless the donation is named and the donor has agreed to public display of their
            picture. Always null for an anonymous donation.
          type: [string, 'null']
    LedgerKind:
      description: |
        | Kind | Effect |
        |---|---|
        | `donation` | allocated + |
        | `donation_reversal` | allocated -, corrects a donation recorded in error |
        | `refund` | allocated -, real money returned to a donor |
        | `transfer_in` | allocated + |
        | `transfer_out` | allocated - |
        | `transfer_in_reversal` | allocated - |
        | `transfer_out_reversal` | allocated + |
        | `disbursement` | delivered + |
        | `disbursement_reversal` | delivered - |
      type: string
      enum:
        - donation
        - donation_reversal
        - refund
        - transfer_in
        - transfer_out
        - transfer_in_reversal
        - transfer_out_reversal
        - disbursement
        - disbursement_reversal
    LedgerEntry:
      type: object
      required: [id, kind, amount, allocatedDelta, deliveredDelta, date, label, reverses, reversedBy]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/LedgerKind' }
        amount:
          description: Always positive. The direction is given by `kind` and by the two deltas.
          $ref: '#/components/schemas/PositiveCents'
        allocatedDelta:
          description: Signed change to the case's `received`.
          $ref: '#/components/schemas/SignedCents'
        deliveredDelta:
          description: Signed change to the case's `delivered`.
          $ref: '#/components/schemas/SignedCents'
        date:
          description: When the movement took effect.
          type: string
          format: date-time
        label:
          description: Localized, ready to display. Never contains a donor name.
          type: string
        reverses:
          description: Identifier of the entry this one corrects.
          type: [string, 'null']
        reversedBy:
          description: Identifier of the entry that corrected this one.
          type: [string, 'null']
    HistoryCounts:
      type: object
      required: [updates, donors, ledger, photos]
      properties:
        updates: { type: integer, minimum: 0 }
        donors:
          description: Number of publicly listed donors. Hidden donations are not counted.
          type: integer
          minimum: 0
        ledger: { type: integer, minimum: 0 }
        photos: { type: integer, minimum: 0 }
    CaseDetail:
      type: object
      required: [case, financials, photos, updates, donors, ledger, counts]
      properties:
        case: { $ref: '#/components/schemas/Case' }
        financials: { $ref: '#/components/schemas/CaseFinancials' }
        photos:
          description: Additional pictures, ordered by `position`. At most 8.
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/CasePhoto' }
        updates:
          description: The 10 newest updates.
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CaseUpdate' }
        donors:
          description: The 10 newest publicly listed donors.
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/PublicDonor' }
        ledger:
          description: The 10 newest ledger entries.
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LedgerEntry' }
        counts: { $ref: '#/components/schemas/HistoryCounts' }
    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 48 }
        totalItems: { type: integer, minimum: 0 }
        totalPages:
          description: At least 1, also when there are no items.
          type: integer
          minimum: 1
    CasePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Case' }
    CaseUpdatePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CaseUpdate' }
    PublicDonorPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PublicDonor' }
    LedgerEntryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LedgerEntry' }
