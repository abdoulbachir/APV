openapi: 3.1.0
info:
  title: APV-GAKASINAY API
  version: 0.4.2
  summary: Public read endpoints (milestone 0), identity (milestone 1) and the donation lifecycle (milestone 2).
  description: |
    Single source of truth for the API between the APV-GAKASINAY frontend and backend.

    Two groups of endpoints:

    - **Public read** (tags Site, Cases, Case history). No authentication, which is what the
      empty root `security` list states. Unchanged from version 0.2.0.
    - **Identity** (tags Authentication, Account). Sign-up, sign-in, the signed-in person's own
      account, and the second factor for staff. Operations that need a signed-in session say
      so with the `sessionCookie` security requirement.

    Donation reporting, administration, uploads and profile editing are added in later
    milestones through their own contract pull requests. The security rules behind the
    identity endpoints are in `contract/identity-and-security.md`.

    ## Conventions

    - **Base path.** Every path is relative to `/api`. Frontend and API are served from one origin.
    - **Money.** Integer US cents. Never a decimal, never a string. One movement is at most
      10,000,000,000 cents. Every total is at most 1,000,000,000,000,000 cents in absolute
      value, which is inside the JavaScript safe integer range. See
      `contract/financial-terms.md` for the exact meaning of each field and for the bounds.
    - **Timestamps.** RFC 3339 instants in UTC with a `Z` suffix and whole seconds, for example
      `2026-11-21T12:00:00Z`. Clients display them in the browser's local timezone.
    - **Date-only values.** `YYYY-MM-DD` with no time and no zone. Only `deadline` uses this.
      It is a calendar day in the zone named by `deadlineTimezone` on the same case.
    - **Language.** Send `Accept-Language`. Supported languages are `en` and `fr`.
      The response carries `Content-Language` and `Vary: Accept-Language`.
      See the `AcceptLanguage` parameter for the fallback rules.
    - **Errors.** Every error uses the `Error` schema. Clients decide what to show from
      `error.code`. `error.message` is English text for developers.
    - **Privacy.** Schemas in this file are public. They never contain draft cases, private
      beneficiary details, hidden donors, or names and pictures of anonymous donors. Every
      object schema is closed (`additionalProperties: false`): a server response with a
      property that is not listed here fails contract tests.
    - **Forward compatibility.** Clients must nevertheless ignore object properties they do
      not know, and must not fail on an unknown `LedgerKind` or category identifier. Use
      `allocatedDelta` and `deliveredDelta` to compute totals.
    - **Pictures.** Every picture address is a same-origin path under `/media/public/`. It is
      never an absolute URL and never points at another site. See
      `contract/media-and-privacy.md`.
    - **Consistent reads.** Each response is computed from one database snapshot, so the
      totals, breakdown, previews and counts inside one response always agree with each other.
    - **Sessions.** Authentication is a server-side session named by a cookie the browser
      sends by itself. There is no token for the frontend to store. The cookie is `HttpOnly`,
      so scripts cannot read it.
    - **CSRF.** Every request using a method other than `GET`, `HEAD` and `OPTIONS` (in this
      contract, every `POST`) needs the header `X-CSRF-TOKEN`, whose value
      comes from `GET /auth/csrf`. This includes sign-up and sign-in. The token is tied to
      the server-side session and dies with it. A 403 `csrf_invalid` is decided before the
      operation runs, so nothing was changed. Fetch a new token after any response that
      changes the session.
    - **Request bodies.** Where an operation defines a body: JSON only,
      `Content-Type: application/json`, at most 16 KiB, and a property that is not in the
      schema is refused with field code `unknown_field`, never silently ignored. Where an
      operation defines no body (`POST /auth/logout`, `POST /auth/mfa/enroll`): send none,
      with no `Content-Type` needed; a non-empty body is refused with 400.
    - **Session states.** Each identity operation lists the states it accepts in
      `x-session-state`: `anonymous`, `mfa_required`, `mfa_enrollment_required`,
      `authenticated`. Called in another state it answers, always the same way: 401 with
      the state's code when more sign-in is owed, 409 `already_signed_in` when the session is
      fully signed in and the operation is for one that is not, 403 `forbidden` when a pending
      session calls the other pending state's operation.
    - **What a 401 means.** The code says which of two different things happened, and
      clients must not treat them alike. `unauthenticated`, `mfa_required` and
      `mfa_enrollment_required` describe the session: it is missing, lost, or still owes a
      second factor. `invalid_credentials` and `mfa_code_invalid` describe only the secret
      sent with this request: it was wrong, and the session is exactly as it was before.
      A lost session is never reported with one of the last two, and a wrong password or code
      is never reported with one of the first three, except that the fifth wrong code of a
      pending sign-in ends it and is `unauthenticated`.
    - **Order of checks.** A request is refused at the first of these it fails: path and
      method (404, 405; an unsupported method is refused here); origin and fetch metadata on
      methods other than `GET`, `HEAD` and `OPTIONS` (403 `forbidden`); body size and declared
      type (413, 415); CSRF token on the same methods (403 `csrf_invalid`); rate limits
      (429); session state (401, 409, 403 `forbidden`); body validation (400); then the
      operation's own check of a password, code or credential. A secret is examined only in
      that last step.
    - **A lost session on a `POST`.** A session that was deleted, rotated or has passed a
      deadline no longer exists, so the token the page still holds for it is refused first:
      403 `csrf_invalid`. `GET /me` then answers 401 `unauthenticated`. A `POST` answers 401
      `unauthenticated` directly only when its token is valid and the operation is a
      protected one, that is, one that does not accept `anonymous`: with a fresh token of an
      anonymous session, or on an identity that was revoked while its session row survived.
      An operation that accepts `anonymous` (sign-in, sign-up, set-password, sign-out) is not
      refused for this: a revoked session is ended and the request proceeds as anonymous.
    - **After `csrf_invalid`.** Fetch a new token and read `GET /me`. Never send a refused
      `POST` again by itself: the person submits again. A `GET` may be repeated.
    - **Identity headers.** Every answer of an identity operation, errors included, is
      `Cache-Control: no-store`. Every 405 has `Allow`. Every 429 and every identity 503 has
      `Retry-After`.
    - **Caching.** Public read responses are `Cache-Control: no-cache` with an `ETag` and never
      depend on who is asking. Every identity response is `Cache-Control: no-store` and has no
      `ETag`.
    - **401 and 403.** A request that needs a session and has none gets 401, never a redirect
      and never HTML. A signed-in request that is not permitted gets 403. A known path with
      an unsupported method gets 405 with an `Allow` header; this deliberately replaces the
      404 that milestone 0B answered in that case. An unknown path still gets 404. Successful
      public read responses are unchanged.
    - **Audiences.** Every schema declares `x-audience`. `public` and `shared` schemas may
      appear in public read responses. `account` schemas hold the signed-in person's own data.
      `request` schemas are sent by the client and never returned. `credential` schemas carry
      a one-time secret and are returned only by the operations named for it.
      `npm run validate` enforces these boundaries.
    - **Ordering of text.** Case codes and identifiers contain ASCII characters only. Wherever
      this contract orders by `code` or `id`, strings are compared character by character
      with no locale rules (PostgreSQL `COLLATE "C"`, JavaScript `<`, never `localeCompare`).
      `HELP-10` therefore sorts before `HELP-9`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin as the frontend.
security: []
tags:
  - name: Authentication
    description: Sign-up, sign-in, sign-out, CSRF token, second factor and one-time credentials.
  - name: Account
    description: The signed-in person's own account.
  - name: Giving
    description: Reporting a gift paid outside the site, its private evidence, and tracking it. No account needed.
  - name: Donation review
    description: A super administrator confirms, rejects, enters and corrects gifts. The rules are in contract/donation-lifecycle.md.
  - name: Site
    description: Settings and platform-wide totals.
  - name: Cases
    description: The public case directory, single cases and the general fund.
  - name: Case history
    description: Paginated updates, donors and ledger entries of one case.
paths:
  /site:
    get:
      tags: [Site]
      operationId: getSite
      summary: Site settings the frontend needs to display data correctly.
      description: |
        Not localized: category labels are returned in both languages, so the client can
        switch language without asking again.

        `categories` holds every active category, plus every inactive category that at least
        one public case still uses, ordered by `position` ascending then `id` ascending.
        A category used only by draft cases is not listed.
      responses:
        '200':
          description: Site settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
              example:
                timezone: America/Chicago
                currency: USD
                locales: [en, fr]
                defaultLocale: en
                categories:
                  - { id: education, labels: { en: Education, fr: Éducation }, position: 1, active: true }
                  - { id: medical, labels: { en: Medical, fr: Santé }, position: 2, active: true }
                  - { id: housing, labels: { en: Housing, fr: Logement }, position: 3, active: true }
                  - { id: family, labels: { en: Family, fr: Famille }, position: 4, active: true }
                  - { id: emergency, labels: { en: Emergency, fr: Urgence }, position: 5, active: true }
                  - { id: other, labels: { en: Other, fr: Autre }, position: 6, active: true }
                  - { id: food, labels: { en: Food, fr: Alimentation }, position: 7, active: true }
                  - { id: transport, labels: { en: Transport, fr: Transport }, position: 8, active: false }
                fundCode: FUND
                pagination: { defaultPageSize: 12, maxPageSize: 48 }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /stats:
    get:
      tags: [Site]
      operationId: getStats
      summary: Platform-wide totals.
      description: |
        Internal transfers between cases and the general fund never change these numbers.
      responses:
        '200':
          description: Platform totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
              example:
                received: 102500
                delivered: 55000
                available: 47500
                peopleHelped: 2
                asOf: '2026-11-24T12:00:00Z'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: Search, filter, sort and page through public cases.
      description: |
        Returns cases of kind `case` only. The general fund is never in this list; read it with
        `GET /cases/FUND`. Draft cases are never returned.

        ## Status groups

        - `active` returns cases whose status is `active` or `funded`.
        - `completed` returns cases whose status is `delivered` or `closed`.

        This grouping is the working proposal and still needs the project owner's confirmation.

        ## Category filter (`category`)

        A category identifier from `GET /site`. An inactive category is still a valid filter,
        so old links keep working; the frontend simply does not offer it in its filter list.
        An identifier that does not exist returns 400 `validation_error` with field code
        `invalid_value`.

        ## Search (`q`)

        Length limits, counted in Unicode code points (JavaScript `[...q].length`, Java
        `codePointCount`), never in UTF-16 units or bytes:

        1. The raw value is at most 200 code points.
        2. After trimming, it is at most 80 code points.

        A value over either limit returns 400 `validation_error` with field code `too_long`.
        It is never silently cut. The limit is checked before normalization.

        Both the query and the searched fields are then normalized the same way:

        1. Unicode NFD decomposition.
        2. Remove code points U+0300 to U+036F (combining marks).
        3. Lower-case with the locale-independent Unicode mapping (JavaScript `toLowerCase()`,
           Java `toLowerCase(Locale.ROOT)`).
        4. Trim leading and trailing white space.

        "White space" in trimming means exactly the ECMAScript `trim` set: U+0009 to U+000D,
        U+0020, U+00A0, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F, U+3000 and
        U+FEFF. White space inside the text is kept as it is.

        A case matches when the normalized query is a substring of at least one of: the English
        title, the French title, the public name, the case code. Each field is tested on its
        own. Both languages are searched whatever `Accept-Language` says. Category labels are
        not searched; use `category`. A query that is empty after trimming applies no filter.
        No other folding is applied (for example `œ` does not match `oe`).

        The backend computes the normalized text in application code, not with database
        functions, so the mock and the real API cannot differ.

        ## Sorting

        Every sort ends with the same tie-breakers: `createdAt` descending, then `code`
        ascending by code point. The funding ratio is `max(received, 0) / goal`. Ratios are
        compared exactly by cross-multiplication with arbitrary-precision integers
        (JavaScript `BigInt`, PostgreSQL `numeric`), never with floating point and never with
        64-bit multiplication, which could overflow.

        | `sort` | Order |
        |---|---|
        | `newest` | `createdAt` descending. |
        | `deadline` | `deadlineEndsAt` ascending. Cases with no deadline last. |
        | `closest` | First, cases with a goal that are below it, ratio descending. Then cases at or above their goal, ratio ascending. Then cases with no goal. |
        | `least` | Cases with a goal, ratio ascending. Then cases with no goal. |
        | `featured` | `featuredRank` ascending. Cases with no rank last, in `newest` order. |

        ## Paging

        A `page` beyond the last page is not an error: it returns an empty `items` array with the
        correct totals.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          schema: { type: string, enum: [active, completed], default: active }
        - name: q
          in: query
          description: Search text. See the limits above.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          description: Omit for all categories.
          schema: { $ref: '#/components/schemas/CategoryId' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, deadline, closest, least, featured], default: newest }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of cases.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePage' }
              example:
                items:
                  - code: HELP-904
                    kind: case
                    status: active
                    acceptingDonations: true
                    category: food
                    featuredRank: null
                    title: Groceries for a month
                    titleLanguage: en
                    publicName: Sample household D
                    story: Fictional sample story in a category added after launch.
                    storyLanguage: en
                    photoUrl: null
                    photoThumbnailUrl: null
                    photoAlt: null
                    photoAltLanguage: null
                    goal: 60000
                    received: 0
                    delivered: 0
                    deadline: '2027-03-14'
                    deadlineTimezone: America/Chicago
                    deadlineEndsAt: '2027-03-15T05:00:00Z'
                    createdAt: '2026-11-15T15:00:00Z'
                page: 1
                pageSize: 1
                totalItems: 2
                totalPages: 2
        '400': { $ref: '#/components/responses/ValidationError' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}:
    get:
      tags: [Cases]
      operationId: getCase
      summary: One public case, or the general fund, with previews of its history.
      description: |
        `updates`, `donors` and `ledger` hold the 10 newest entries of each. `counts` holds the
        full number of entries. Older entries are read from the three history endpoints, so the
        complete financial record of a case is always reachable.

        Everything in the response comes from one database snapshot taken at `asOf`.

        A draft case, or a code that does not exist, returns 404 `case_not_found`. The two are
        indistinguishable on purpose.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The case.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
              example:
                case:
                  code: HELP-901
                  kind: case
                  status: active
                  acceptingDonations: true
                  category: education
                  featuredRank: 1
                  title: School supplies for a new term
                  titleLanguage: en
                  publicName: Sample household A
                  story: Fictional sample story.
                  storyLanguage: en
                  photoUrl: /media/public/Zk3vQ9xT1bLw7RmN2cYp4A/display.webp
                  photoThumbnailUrl: /media/public/Zk3vQ9xT1bLw7RmN2cYp4A/thumb.webp
                  photoAlt: Symbolic artwork of a school bag
                  photoAltLanguage: en
                  goal: 100000
                  received: 38500
                  delivered: 30000
                  deadline: '2027-01-18'
                  deadlineTimezone: America/Chicago
                  deadlineEndsAt: '2027-01-19T06:00:00Z'
                  createdAt: '2026-10-04T15:00:00Z'
                financials:
                  externalDonations: 28500
                  transfersIn: 10000
                  transfersOut: 0
                  allocated: 38500
                  delivered: 30000
                  available: 8500
                  hasShortfall: false
                photos:
                  - id: photo-1
                    url: /media/public/h8Jd2LmQ5sXc0VbN6tYu1E/display.webp
                    thumbnailUrl: /media/public/h8Jd2LmQ5sXc0VbN6tYu1E/thumb.webp
                    alt: Symbolic artwork of notebooks
                    altLanguage: en
                    position: 1
                updates:
                  - id: U1
                    caseCode: HELP-901
                    text: Sample update written in English only.
                    textLanguage: en
                    photoUrl: null
                    photoAlt: null
                    photoAltLanguage: null
                    date: '2026-11-19T17:30:00Z'
                    author: Sample Admin
                    authorAvatarUrl: null
                donors:
                  - { id: D3, name: null, amount: 3500, date: '2026-11-06T12:00:00Z', avatarUrl: null }
                  - { id: D2, name: Sample Donor Two, amount: 20000, date: '2026-11-05T12:00:00Z', avatarUrl: null }
                ledger:
                  - { id: L11, kind: transfer_in_reversal, amount: 5000, allocatedDelta: -5000, deliveredDelta: 0, date: '2026-11-13T12:00:00Z', label: Received transfer cancelled, corrects: L06, correctedBy: [], correctedAmount: 0, netAmount: 5000, counterpartCaseCode: FUND }
                  - { id: L09, kind: refund, amount: 2500, allocatedDelta: -2500, deliveredDelta: 0, date: '2026-11-12T12:00:00Z', label: Refund to donor, corrects: L03, correctedBy: [], correctedAmount: 0, netAmount: 2500, counterpartCaseCode: null }
                  - { id: L08, kind: refund, amount: 4000, allocatedDelta: -4000, deliveredDelta: 0, date: '2026-11-10T12:00:00Z', label: Refund to donor, corrects: L03, correctedBy: [], correctedAmount: 0, netAmount: 4000, counterpartCaseCode: null }
                  - { id: L07, kind: disbursement, amount: 30000, allocatedDelta: 0, deliveredDelta: 30000, date: '2026-11-09T12:00:00Z', label: Delivered to the beneficiary, corrects: null, correctedBy: [], correctedAmount: 0, netAmount: 30000, counterpartCaseCode: null }
                  - { id: L06, kind: transfer_in, amount: 15000, allocatedDelta: 15000, deliveredDelta: 0, date: '2026-11-08T12:00:00Z', label: Transfer received, corrects: null, correctedBy: [L11], correctedAmount: 5000, netAmount: 10000, counterpartCaseCode: FUND }
                  - { id: L04, kind: donation, amount: 5000, allocatedDelta: 5000, deliveredDelta: 0, date: '2026-11-07T12:00:00Z', label: Confirmed gift, corrects: null, correctedBy: [], correctedAmount: 0, netAmount: 5000, counterpartCaseCode: null }
                  - { id: L03, kind: donation, amount: 10000, allocatedDelta: 10000, deliveredDelta: 0, date: '2026-11-06T12:00:00Z', label: Confirmed gift, corrects: null, correctedBy: [L08, L09], correctedAmount: 6500, netAmount: 3500, counterpartCaseCode: null }
                  - { id: L02, kind: donation, amount: 20000, allocatedDelta: 20000, deliveredDelta: 0, date: '2026-11-05T12:00:00Z', label: Confirmed gift, corrects: null, correctedBy: [], correctedAmount: 0, netAmount: 20000, counterpartCaseCode: null }
                counts: { updates: 1, donors: 2, ledger: 8, photos: 1 }
                asOf: '2026-11-24T12:00:00Z'
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/updates:
    get:
      tags: [Case history]
      operationId: listCaseUpdates
      summary: Updates posted on a case, newest first.
      description: Ordered by `date` descending, then `id` descending by code point.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of updates.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseUpdatePage' }
              example:
                items:
                  - id: U1
                    caseCode: HELP-901
                    text: Sample update written in English only.
                    textLanguage: en
                    photoUrl: null
                    photoAlt: null
                    photoAltLanguage: null
                    date: '2026-11-19T17:30:00Z'
                    author: Sample Admin
                    authorAvatarUrl: null
                page: 1
                pageSize: 12
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/donors:
    get:
      tags: [Case history]
      operationId: listCaseDonors
      summary: Publicly listed donors of a case, newest first.
      description: |
        One entry per confirmed donation whose visibility is `named` or `anonymous` and whose
        net amount is above zero. The net amount is the donation minus every refund and
        reversal recorded against it. Donations with visibility `hidden` are never listed.
        Ordered by `date` descending, then `id` descending by code point.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of donors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDonorPage' }
              example:
                items:
                  - { id: D3, name: null, amount: 3500, date: '2026-11-06T12:00:00Z', avatarUrl: null }
                  - { id: D2, name: Sample Donor Two, amount: 20000, date: '2026-11-05T12:00:00Z', avatarUrl: null }
                page: 1
                pageSize: 12
                totalItems: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/ledger:
    get:
      tags: [Case history]
      operationId: listCaseLedger
      summary: Every financial movement of a case, newest first.
      description: |
        The complete public financial record. Entries are never edited or removed; a correction
        is a new entry that points at the one it corrects. Ordered by `date` descending, then
        `id` descending by code point.

        For any case, over all pages:

        - the sum of `allocatedDelta` equals `Case.received`;
        - the sum of `deliveredDelta` equals `Case.delivered`.

        ## Reading several pages while money moves

        Paging uses offsets. Each page is its own snapshot, so a movement recorded between two
        requests shifts later entries by one position: a client reading forward can then see
        one entry twice, and its totals no longer match the first page.

        Because the ledger only ever grows, `totalItems` changes whenever anything changed.
        A client that needs an exact reconciliation therefore:

        1. reads `GET /cases/{code}` and keeps `counts.ledger`;
        2. reads every ledger page and checks that `totalItems` equals that number each time;
        3. starts again if it ever differs.

        `correctedBy`, `correctedAmount` and `netAmount` of an older entry change only when a
        new entry is added, so the same check covers them.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of ledger entries.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryPage' }
              example:
                items:
                  - { id: L11, kind: transfer_in_reversal, amount: 5000, allocatedDelta: -5000, deliveredDelta: 0, date: '2026-11-13T12:00:00Z', label: Received transfer cancelled, corrects: L06, correctedBy: [], correctedAmount: 0, netAmount: 5000, counterpartCaseCode: FUND }
                  - { id: L09, kind: refund, amount: 2500, allocatedDelta: -2500, deliveredDelta: 0, date: '2026-11-12T12:00:00Z', label: Refund to donor, corrects: L03, correctedBy: [], correctedAmount: 0, netAmount: 2500, counterpartCaseCode: null }
                page: 1
                pageSize: 2
                totalItems: 8
                totalPages: 4
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      summary: Obtain the CSRF token to send with every request using a method other than GET, HEAD and OPTIONS.
      description: |
        Returns the token for this browser's session. Send it in the header named by
        `headerName` on every `POST`.

        The token belongs to the server-side session. A browser with no session gets an
        anonymous one here (the session cookie is set), which holds nothing but the token and
        expires after 30 idle minutes. There is no separate CSRF cookie.

        The token stops being valid whenever the session identifier changes or the session
        ends: sign-in, second-factor verification, completed enrollment, password change,
        sign-out, expiry. Call this again after each of those. After a 403 `csrf_invalid`,
        fetch a new token, read `GET /me`, and let the person submit again: a refused `POST`
        is never sent again automatically (`contract/identity-and-security.md` section 9.1).
      x-returns-credential: true
      responses:
        '200':
          description: The token. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
              example:
                headerName: X-CSRF-TOKEN
                token: 5pZbJ3mQ0cR8sT1uV4wX7yZ9aB2dE6fG
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/options:
    get:
      tags: [Authentication]
      operationId: getAuthOptions
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      summary: What the sign-in screens should offer.
      description: |
        Says whether public sign-up is open on this server. It is closed in production until
        the site can prove who owns an email address. The frontend hides the sign-up form when
        it is closed; the server refuses sign-up either way.
      responses:
        '200':
          description: The options. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthOptions' }
              example:
                registrationOpen: false
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required]
      summary: Create an ordinary donor account.
      description: |
        Always creates a donor. The request has no role or permission property, and sending
        one is refused as an unknown field.

        When sign-up is closed (`GET /auth/options` says so, and it is closed in production
        until the site can prove who owns an address) the answer is 403 `registration_closed`
        and nothing is created.

        When it is open, the answer is the same whether or not the address was already
        registered, and takes the same time: 202 with no account data. No session is created.
        The person then signs in. If an account already existed, it is untouched and its
        password is not changed.

        The address must be sent without surrounding white space; the server does not trim.
        A fully signed-in session gets 409 `already_signed_in`.

        The email address is not verified in this milestone, because the site does not send
        email yet. `emailVerified` stays false.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              email: sample.donor@example.org
              password: correct horse battery staple 42
              displayName: Sample Donor
              locale: en
      responses:
        '202':
          description: The request was accepted. Says nothing about whether an account was created.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
              example:
                status: accepted
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required]
      summary: Sign in with email and password.
      description: |
        A wrong password, an unknown address and a disabled account all give the same 401
        `invalid_credentials`, after the same amount of work.

        On success the session identifier is replaced, so an identifier known before sign-in
        is worthless afterwards. `status` says what the session can do:

        - `authenticated`: signed in. `account` is present.
        - `mfa_required`: the password was right, and this account must now prove its second
          factor with `POST /auth/mfa/verify`. The session has no permission until then.
        - `mfa_enrollment_required`: a staff account that has not set up its second factor.
          It must do so with `POST /auth/mfa/enroll` and `POST /auth/mfa/confirm`. The session
          has no permission until then.

        A session that is already fully signed in gets 409 `already_signed_in` and is left
        untouched: the frontend reads `GET /me` and offers to sign out. A session that was
        waiting for a second factor is discarded and replaced by this sign-in.

        If the answer is lost on the way, do not send the password again blindly: read
        `GET /me`, whose answer says which state the browser is in.

        Fetch a new CSRF token after this call.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: sample.donor@example.org
              password: correct horse battery staple 42
      responses:
        '200':
          description: The password was correct.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example:
                status: authenticated
                account:
                  id: acc_7Yk2mQ9xT1bLw4RmN8cYp3
                  email: sample.donor@example.org
                  emailVerified: false
                  displayName: Sample Donor
                  role: donor
                  permissions: [account.read_own, account.change_password]
                  mfa: { required: false, enrolled: false, recoveryCodesRemaining: null }
                  locale: en
                  createdAt: '2026-11-24T12:00:00Z'
                  session: { idleExpiresAt: '2026-11-24T14:00:00Z', absoluteExpiresAt: '2026-11-25T12:00:00Z' }
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      summary: End the current session.
      description: |
        Deletes the session on the server and clears the cookie. Succeeds also when there was
        no session, so it can always be called. Fetch a new CSRF token afterwards.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Signed out.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      x-session-state: [authenticated]
      summary: Change the signed-in person's own password.
      description: |
        Needs the current password. On success every other session of the account is ended,
        and the identifier of this session is replaced. A wrong current password is 401
        `invalid_credentials` and counts toward the account's password rate limit; the session
        stays signed in and nothing else changes. 401 `unauthenticated` means something
        different: there is no signed-in session any more.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example:
              currentPassword: correct horse battery staple 42
              newPassword: an even longer passphrase for 2027
      responses:
        '204':
          description: The password was changed.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/set-password:
    post:
      tags: [Authentication]
      operationId: setPasswordWithCredential
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required]
      summary: Set a password with a one-time credential (staff activation or password reset).
      description: |
        The credential is issued by the operator, expires quickly and works once. It only lets
        its holder choose a password: it does not sign anyone in, and it never replaces the
        second factor. After success every session of the account is ended and the person
        signs in normally.

        A wrong, malformed, expired or already used credential gives the same 400
        `credential_invalid`: any text is accepted by the schema so that its shape reveals
        nothing. A fully signed-in session gets 409 `already_signed_in` and must sign out
        first.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
            example:
              credential: q3Zr8vT1nK5xW0bM7cJ2fH9dL4sP6gY1aE8uR3tV0oI
              newPassword: an even longer passphrase for 2027
      responses:
        '204':
          description: The password was set. Sign in next.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/SetPasswordRejected' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/verify:
    post:
      tags: [Authentication]
      operationId: verifyMfa
      x-session-state: [mfa_required]
      summary: Complete sign-in with the second factor.
      description: |
        Only for a session whose sign-in answered `mfa_required`. Accepts a six-digit code from
        the authenticator application, or one recovery code. A code works once, also when two
        requests send it at the same instant.

        The first four wrong codes answer 401 `mfa_code_invalid`. The fifth ends the pending
        session and answers 401 `unauthenticated`: the person starts again with the password.

        After that, and after a pending session has expired (10 minutes), the session no
        longer exists. A later call that still carries its CSRF token answers 403
        `csrf_invalid`; one made with a fresh token of an anonymous session answers 401
        `unauthenticated`. Neither checks the code.

        On success the session identifier is replaced again and the session becomes
        `authenticated`. Fetch a new CSRF token afterwards.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
            example:
              method: totp
              code: '492039'
      responses:
        '200':
          description: The second factor was accepted.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedIn' }
              example:
                status: authenticated
                account:
                  id: acc_2Bd5fH8jK1mN4pQ7sT0vW3
                  email: sample.admin@example.org
                  emailVerified: false
                  displayName: Sample Admin
                  role: admin
                  permissions: [account.read_own, account.change_password]
                  mfa: { required: true, enrolled: true, recoveryCodesRemaining: 9 }
                  locale: fr
                  createdAt: '2026-11-24T12:00:00Z'
                  session: { idleExpiresAt: '2026-11-24T12:30:00Z', absoluteExpiresAt: '2026-11-25T00:00:00Z' }
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/MfaCodeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/enroll:
    post:
      tags: [Authentication]
      operationId: beginMfaEnrollment
      x-session-state: [mfa_enrollment_required]
      summary: Start setting up the authenticator application.
      description: |
        Only for a session whose sign-in answered `mfa_enrollment_required`. Returns the secret
        to add to an authenticator application, once. An account has at most one pending
        secret: calling this again, from this tab or another, replaces it, and a code from the
        replaced secret is then refused. Nothing is active until `POST /auth/mfa/confirm`
        succeeds. If the answer is lost on the way, call it again.
      x-returns-credential: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The pending secret. Shown once, never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollment' }
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/APV-GAKASINAY:sample.admin%40example.org?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=APV-GAKASINAY&algorithm=SHA1&digits=6&period=30
                expiresAt: '2026-11-24T12:10:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/confirm:
    post:
      tags: [Authentication]
      operationId: confirmMfaEnrollment
      x-session-state: [mfa_enrollment_required]
      summary: Finish setting up the authenticator application.
      description: |
        Proves the authenticator application works by sending one code from it. On success the
        second factor is active, the session becomes `authenticated` with a new identifier,
        and ten recovery codes are returned, once. Read `GET /me` next, and fetch a new CSRF
        token.

        A wrong code, or a code for a pending secret that expired or was replaced, answers 401
        `mfa_code_invalid`; the pending session is kept, and the person starts again with
        `POST /auth/mfa/enroll`.

        The enrollment window is checked again here. If it has closed, the answer is 401
        `unauthenticated`, the pending session is ended and nothing is activated.

        When several requests confirm at the same instant, exactly one succeeds: one factor
        becomes active and one set of recovery codes exists. Every other request fails and
        receives no codes. Which error it gets is fixed by what it presents: 409
        `already_signed_in` if it arrives on the session that is now signed in, with that
        session's current token; 403 `csrf_invalid` if it still carries the token or the
        session identifier from before the rotation; 401 `unauthenticated` if it carries a
        fresh token of an anonymous session; 401 `mfa_code_invalid` if it came from another
        pending session of the same account, whose pending secret no longer exists.

        If the answer is lost on the way, the codes are gone: sign in and replace them with
        `POST /auth/mfa/recovery-codes`.
      x-returns-credential: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaConfirmRequest' }
            example:
              code: '492039'
      responses:
        '200':
          description: The second factor is active. The recovery codes are shown once.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
              example:
                codes:
                  - ABCD-EFGH-JKLM-NPQR
                  - STUV-WXYZ-2345-67AB
                  - CDEF-GHJK-LMNP-QRST
                  - UVWX-YZ23-4567-ABCD
                  - EFGH-JKLM-NPQR-STUV
                  - WXYZ-2345-67AB-CDEF
                  - GHJK-LMNP-QRST-UVWX
                  - YZ23-4567-ABCD-EFGH
                  - JKLM-NPQR-STUV-WXYZ
                  - 2345-67AB-CDEF-GHJK
                generatedAt: '2026-11-24T12:05:00Z'
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/MfaCodeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/recovery-codes:
    post:
      tags: [Authentication]
      operationId: regenerateRecoveryCodes
      x-session-state: [authenticated]
      summary: Replace all recovery codes.
      description: |
        For a fully signed-in staff account. Needs the current password and a fresh code from
        the authenticator application, even though the session is already signed in. Every old
        recovery code stops working. A recovery code cannot be used to obtain new ones.
      x-returns-credential: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryCodesRequest' }
            example:
              currentPassword: correct horse battery staple 42
              code: '492039'
      responses:
        '200':
          description: Ten new recovery codes, shown once.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
              example:
                codes:
                  - ABCD-EFGH-JKLM-NPQR
                  - STUV-WXYZ-2345-67AB
                  - CDEF-GHJK-LMNP-QRST
                  - UVWX-YZ23-4567-ABCD
                  - EFGH-JKLM-NPQR-STUV
                  - WXYZ-2345-67AB-CDEF
                  - GHJK-LMNP-QRST-UVWX
                  - YZ23-4567-ABCD-EFGH
                  - JKLM-NPQR-STUV-WXYZ
                  - 2345-67AB-CDEF-GHJK
                generatedAt: '2026-11-24T12:05:00Z'
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /me:
    get:
      tags: [Account]
      operationId: getMyAccount
      x-session-state: [authenticated]
      summary: The signed-in person's own account.
      description: |
        The frontend calls this when it loads, to learn whether someone is signed in. The 401
        code says which state the browser is in:

        - `unauthenticated`: nobody is signed in.
        - `mfa_required`: the password was accepted and the second factor is still owed.
        - `mfa_enrollment_required`: a staff account must set up its second factor first.

        `permissions` lists what this account can do with the endpoints that exist today. Use
        it to decide what to show. It is not a security boundary: the server checks every
        request itself.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example:
                id: acc_7Yk2mQ9xT1bLw4RmN8cYp3
                email: sample.donor@example.org
                emailVerified: false
                displayName: Sample Donor
                role: donor
                permissions: [account.read_own, account.change_password]
