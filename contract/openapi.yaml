    AccountId:
      x-audience: account
      description: |
        Opaque identifier of an account. Assigned once, never changed, never reused, and not
        derived from the email address. Never appears in a public response.
      type: string
      pattern: '^acc_[A-Za-z0-9]{22}$'
    EmailAddress:
      x-audience: account
      description: |
        An email address, at most 254 characters, ASCII only in this version. It must be sent
        without surrounding white space: the server does not trim, and refuses it with
        `invalid_format`. The server lower-cases it; two addresses that are equal after that
        are the same account. Nothing else is folded: dots and "+tags" are kept as written.
      type: string
      minLength: 6
      maxLength: 254
      pattern: '^[A-Za-z0-9.!#$%&''*+/=?^_`{|}~-]+@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
    DisplayName:
      x-audience: account
      description: The name the person chose for their account. Not shown publicly by this milestone.
      type: string
      minLength: 1
      maxLength: 80
    Role:
      x-audience: account
      description: |
        Stored role of an account. A visitor who is not signed in has no account and no role.
        Sign-up always creates `donor`.
      type: string
      enum: [donor, admin, super_admin]
    Permission:
      x-audience: account
      description: |
        A permission that works with the endpoints of this contract version. Only these two
        exist in milestone 1. Staff permissions are added to this list in the milestone that
        adds their endpoints; their planned names are in `contract/identity-and-security.md`
        and are never returned before then.
      type: string
      enum:
        - account.read_own
        - account.change_password
    NewPassword:
      x-audience: request
      description: |
        A password being chosen. Any characters, including spaces. Never trimmed and never
        cut. Length is counted in Unicode code points, twice: as sent it is at most 128, and
        after NFC normalization it is 15 to 128. Outside that it is refused (`too_short`,
        `too_long`). Refused with field code `compromised` when it is on the list of known
        breached passwords or is built from the site name, the address or the display name.
      type: string
      minLength: 15
      maxLength: 128
    ExistingPassword:
      x-audience: request
      description: A password being checked. Only its maximum length is validated.
      type: string
      minLength: 1
      maxLength: 128
    TotpCode:
      x-audience: request
      description: Six digits from the authenticator application.
      type: string
      pattern: '^[0-9]{6}$'
    OneTimeCredential:
      x-audience: request
      description: |
        A single-use credential issued by the operator for activation, password reset or
        staff recovery. Deliberately has no pattern: any text is accepted here and a wrong one
        is answered with `credential_invalid`, so its shape reveals nothing.
      type: string
      minLength: 1
      maxLength: 128
    RecoveryCode:
      x-audience: request
      description: One recovery code as shown, upper case, with or without the dashes.
      type: string
      pattern: '^[A-Z2-7]{4}(-?[A-Z2-7]{4}){3}$'
    RegisterRequest:
      x-audience: request
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: { $ref: '#/components/schemas/EmailAddress' }
        password: { $ref: '#/components/schemas/NewPassword' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
