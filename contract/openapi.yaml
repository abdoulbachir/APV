          type: [string, 'null']
        photoAltLanguage:
          oneOf:
            - $ref: '#/components/schemas/Locale'
            - type: 'null'
        date: { $ref: '#/components/schemas/Timestamp' }
        author:
          description: Display name of the administrator who posted it. Never translated.
