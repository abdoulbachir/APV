        '503': { $ref: '#/components/responses/IdentityUnavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-apv_session
      description: |
        The server-side session. Set by `POST /auth/login`, or earlier by `GET /auth/csrf` as an
        anonymous session that only holds the CSRF token. `HttpOnly`, `Secure`,
        `SameSite=Lax`, `Path=/`, no `Domain`. On a developer's machine over plain HTTP the
        cookie is named `apv_session` and is not `Secure`; that form is refused outside the
        development profile.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A random value chosen by the client for one intended action, and sent again unchanged
        when that same request is repeated. The same key with the same request returns the
        first answer and writes nothing more; the same key with a different request is 409
        `idempotency_key_reused`. Kept in memory only. A key of a guest report is remembered
        for 24 hours; a key of a staff operation belongs to the account that used it and is
        remembered for 7 days.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{22,64}$' }
      example: b6f0c1de-7a52-4c1e-9d3f-2e8a51c07b94
    EvidenceToken:
      name: X-Evidence-Token
      in: header
      required: true
      description: The upload token of the receipt. Names one gift, works once, lasts 30 minutes. Never in an address or in storage.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      example: f3Kq9ZxT1mB7vLw2RnC8yPd4HsJ6uGa0EoXiVtY5QkM
    DonationIdPath:
      name: donationId
      in: path
      required: true
      description: Identifier of a gift, as the review list returns it.
      schema: { $ref: '#/components/schemas/DonationId' }
      example: don_4Tq8ZbN2rLx7Vd1KmP5sWy
    DonationStateFilter:
      name: status
      in: query
      description: Which gifts to list. `reported` is the review queue.
      schema: { type: string, enum: [reported, confirmed, rejected, all], default: reported }
    DonationCaseFilter:
      name: caseCode
      in: query
      description: Keeps gifts reported or confirmed for this case. Matched case-insensitively.
      schema: { type: string, pattern: '^[A-Za-z]{2,8}(-[0-9]{1,6})?$', maxLength: 16 }
    DonationReferenceFilter:
      name: reference
      in: query
      description: Keeps the gift with this reference, with or without the dash.
      schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}-?[0-9A-HJKMNP-TV-Z]{4}$' }
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: The token from `GET /auth/csrf`. Required on every request using a method other than `GET`, `HEAD` and `OPTIONS`.
      schema: { type: string, minLength: 16, maxLength: 512 }
      example: 5pZbJ3mQ0cR8sT1uV4wX7yZ9aB2dE6fG
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: |
        Preferred language. The server picks the first supported language (`en` or `fr`) in the
        header, honoring quality values and ignoring region subtags (`fr-CA` is `fr`). A missing
        header, or one with no supported language, means `en`.

        Which text can fall back:

        - **Never falls back:** case titles and stories (a case cannot be published without
          both languages, pending owner approval), category labels, ledger labels.
        - **Can fall back:** update text and picture descriptions. When there is no text in
          the chosen language, the other language is returned.
        - **Never translated:** personal names, public names and author names.

        Every localized field has a companion property naming the language actually returned
        (`titleLanguage`, `storyLanguage`, `textLanguage`, `altLanguage`, `photoAltLanguage`),
        so the client can set the HTML `lang` attribute on exactly that text.
      schema: { type: string, default: en }
      example: fr
    CaseCode:
      name: code
      in: path
      required: true
      description: |
        Case code. Matched case-insensitively. Responses always carry the canonical upper-case
        code. `FUND` is the general fund.
      schema: { type: string, pattern: '^[A-Za-z]{2,8}(-[0-9]{1,6})?$', maxLength: 16 }
      example: HELP-014
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
  headers:
    NoStore:
      description: Always `no-store`. The response must not be kept by any cache, and has no `ETag`.
      schema: { type: string, const: no-store }
    Allow:
      description: The methods this path supports.
      schema: { type: string }
    ContentLanguage:
      description: The language chosen for the response, `en` or `fr`.
      schema: { $ref: '#/components/schemas/Locale' }
    Vary:
      description: Always includes `Accept-Language` on localized responses.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
  responses:
    GivingValidationError:
      description: |
        A path parameter, a query parameter, a header of the operation or the body is invalid.
        Never cached. `fields` names what is wrong; a header is named as it is written, for
        example `Idempotency-Key`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: amount must be at least 1
              fields: [{ name: amount, code: out_of_range }]
              requestId: 5f0c1c9e2b7a4d1f
    GivingForbidden:
      description: |
        `forbidden` when the `Origin` or `Sec-Fetch-Site` header shows the request did not
        come from the site's own page (checked first). `csrf_invalid` when the CSRF header is
        missing or does not belong to a live session. Both are decided before the body is
        read: nothing was recorded or counted. After `csrf_invalid`, fetch a token and let
        the person submit again; never resend by itself.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: csrf_invalid, message: Missing or invalid CSRF token, requestId: 5f0c1c9e2b7a4d1f }
    GivingRateLimited:
      description: Too many requests. Wait `Retry-After` seconds; never more than 60 minutes.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Too many requests, requestId: 5f0c1c9e2b7a4d1f }
    GivingUnavailable:
      description: |
        `reporting_paused`: the site is holding back new reports, because too many arrived or
        too many wait to be reviewed. Nothing was recorded. `unavailable`: temporarily
        unavailable, including when too many pictures are being processed or the storage for
        screenshots is full; a gift already reported stays recorded.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: reporting_paused, message: Reports cannot be taken at the moment, requestId: 5f0c1c9e2b7a4d1f }
    ReportConflict:
      description: |
        Nothing was recorded. `case_not_accepting`: the case does not take gifts now.
        `payment_details_changed`: the recipient details the report names were replaced 24
        hours ago or more; read the methods again. `idempotency_key_reused`: this key was
        already used for a different report.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: case_not_accepting, message: This case does not accept gifts now, requestId: 5f0c1c9e2b7a4d1f }
    EvidenceRejected:
      description: |
        The gift stays as it was, reported and without a screenshot.
        `evidence_token_invalid`: the token is wrong, expired, already used, or its gift is no
        longer `reported`; the four look the same. `evidence_invalid`: the content is not a
        JPEG or PNG that can be decoded within the limits. `validation_error`: a header is
        missing or malformed.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: evidence_token_invalid, message: Invalid or expired upload token, requestId: 5f0c1c9e2b7a4d1f }
    EvidenceTooLarge:
      description: The picture is larger than 5 MiB. The body is not read past the limit.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: payload_too_large, message: Picture too large, requestId: 5f0c1c9e2b7a4d1f }
    EvidenceUnsupportedType:
      description: The declared type is neither `image/jpeg` nor `image/png`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unsupported_media_type, message: Content-Type must be image/jpeg or image/png, requestId: 5f0c1c9e2b7a4d1f }
    StaffUnauthenticated:
      description: |
        About the session, never about the request: `unauthenticated` when nobody is signed
        in or the session was lost, `mfa_required` or `mfa_enrollment_required` when a second
        factor is still owed. On a `POST` these are reached only with a valid CSRF token; a
        lost session's stale token is refused first with 403 `csrf_invalid`. Nothing was
        changed and the gift identifier was not looked at.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unauthenticated, message: Sign-in required, requestId: 5f0c1c9e2b7a4d1f }
    StaffForbidden:
      description: |
        `forbidden` when the `Origin` or `Sec-Fetch-Site` header shows the request did not
        come from the site's own page (checked first, on a `POST`), or when the signed-in
        account does not hold the permission of the operation (checked after the token, and
        before the gift identifier is looked at). `csrf_invalid` when the CSRF header of a
        `POST` is missing or does not belong to a live session. Nothing was changed.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: forbidden, message: Not allowed, requestId: 5f0c1c9e2b7a4d1f }
    DonationNotFound:
      description: |
        No such gift. For a tracking code: the code is wrong, malformed beyond what the schema
        refuses, or names no gift; all are answered alike.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: donation_not_found, message: Gift not found, requestId: 5f0c1c9e2b7a4d1f }
    EvidenceNotFound:
      description: |
        `evidence_not_found`: the gift has no screenshot, or it has been deleted.
        `donation_not_found`: no such gift.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: evidence_not_found, message: No screenshot for this gift, requestId: 5f0c1c9e2b7a4d1f }
    DonationConflict:
      description: |
        Nothing was changed. `donation_state_conflict`: the gift is not in the state this
        operation needs, for example it was decided a moment ago by another request.
        `idempotency_key_reused`: this key was already used for a different request.
        `duplicate_payment_reference`: that provider reference is already recorded.
        `correction_exceeds_remaining`: the correction is larger than what still stands of
        the gift. `reentry_not_allowed`: the gift named by `reentryOf` cannot be re-entered.
        `platform_limit_reached`: the write would pass the bound on all movements.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: donation_state_conflict, message: The gift is not in the required state, requestId: 5f0c1c9e2b7a4d1f }
    Unauthenticated:
      description: |
        Two kinds of 401, told apart by the code.

        About the session: `unauthenticated` when there is no sign-in at all or it was lost,
        `mfa_required` / `mfa_enrollment_required` when a second factor is still owed. On a
        `POST` these are reached only with a valid CSRF token; a lost session's stale token is
        refused first with 403 `csrf_invalid`.

        About the secret in this request only, with the session unchanged: on
        `POST /auth/change-password` and `POST /auth/mfa/recovery-codes`, `invalid_credentials`
        when the password sent to confirm the action is wrong, and on the second of these
        `mfa_code_invalid` when the code is wrong.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unauthenticated, message: Sign-in required, requestId: 5f0c1c9e2b7a4d1f }
    InvalidCredentials:
      description: |
        The address and password do not match an account that can sign in. Deliberately says
        no more. It is about the secret sent, never about the session.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: invalid_credentials, message: Invalid credentials, requestId: 5f0c1c9e2b7a4d1f }
    MfaCodeInvalid:
      description: |
        `mfa_code_invalid`: the code is wrong, expired, already used, or belongs to a replaced
        pending secret. The pending session is kept and the person may try again.
        `unauthenticated`: this was the fifth wrong code and the pending session has been
        ended; or the enrollment window closed; or the request carries a valid token of a
        session that is not pending. The person starts again with the password. (A request
        still carrying the token of a pending session that expired or was ended gets 403
        `csrf_invalid` instead, before this is evaluated.)
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: mfa_code_invalid, message: Invalid code, requestId: 5f0c1c9e2b7a4d1f }
    Forbidden:
      description: |
        `forbidden` when the `Origin` or `Sec-Fetch-Site` header shows the request did not
        come from the site's own page (checked first), or when the session is not allowed to
        do this (checked after the token). `csrf_invalid` when the CSRF header is missing or
        does not belong to a live session, which includes a session that was deleted, rotated
        or has expired; decided before the session state, the body and any secret are looked
        at, so nothing was changed or counted. `registration_closed` on sign-up when it is
        closed.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: csrf_invalid, message: Missing or invalid CSRF token, requestId: 5f0c1c9e2b7a4d1f }
    AlreadySignedIn:
      description: |
        The session is fully signed in, and this operation is only for one that is not.
        Nothing was changed. Read `GET /me`, and sign out first if another account is meant.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: already_signed_in, message: Already signed in, requestId: 5f0c1c9e2b7a4d1f }
    SetPasswordRejected:
      description: |
        `credential_invalid`: the one-time credential is wrong, malformed, expired or already
        used; all four look the same. `validation_error`: the body or the new password breaks
        the rules.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: credential_invalid, message: Invalid or expired credential, requestId: 5f0c1c9e2b7a4d1f }
    IdentityValidationError:
      description: The request body is invalid. Never cached.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: password is too short
              fields: [{ name: password, code: too_short }]
              requestId: 5f0c1c9e2b7a4d1f
    IdentityRateLimited:
      description: Too many attempts. Wait `Retry-After` seconds; never more than 15 minutes, 60 for sign-up.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Too many requests, requestId: 5f0c1c9e2b7a4d1f }
    IdentityInternalError:
      description: Unexpected server error. Says nothing else.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal_error, message: Unexpected error, requestId: 5f0c1c9e2b7a4d1f }
    IdentityUnavailable:
      description: Temporarily unavailable, including when too many passwords are being checked at once.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unavailable, message: Service unavailable, requestId: 5f0c1c9e2b7a4d1f }
    IdentityMethodNotAllowed:
      description: The path exists and does not support this method.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Allow: { $ref: '#/components/headers/Allow' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: method_not_allowed, message: Method not allowed, requestId: 5f0c1c9e2b7a4d1f }
    MethodNotAllowed:
      description: The path exists and does not support this method.
      headers:
        Allow: { $ref: '#/components/headers/Allow' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: method_not_allowed, message: Method not allowed, requestId: 5f0c1c9e2b7a4d1f }
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unsupported_media_type, message: Content-Type must be application/json, requestId: 5f0c1c9e2b7a4d1f }
    PayloadTooLarge:
      description: The request body is larger than 16 KiB.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: payload_too_large, message: Request body too large, requestId: 5f0c1c9e2b7a4d1f }
    ValidationError:
      description: A query parameter is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: pageSize must be between 1 and 48
              fields: [{ name: pageSize, code: out_of_range }]
              requestId: 5f0c1c9e2b7a4d1f
    CaseNotFound:
      description: No public case has this code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: case_not_found, message: Case not found, requestId: 5f0c1c9e2b7a4d1f }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Too many requests, requestId: 5f0c1c9e2b7a4d1f }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal_error, message: Unexpected error, requestId: 5f0c1c9e2b7a4d1f }
    Unavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unavailable, message: Service unavailable, requestId: 5f0c1c9e2b7a4d1f }
  schemas:
    DonationId:
      x-audience: account
      description: Opaque identifier of a gift. Staff only, never public, not derived from the donor or the payment.
      type: string
      pattern: '^don_[A-Za-z0-9]{22}$'
    DonationReference:
      x-audience: shared
      description: The short reference a donor quotes when contacting the organisers. Eight characters without look-alike letters, written in two groups of four.
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$'
    PaidDate:
      x-audience: shared
      description: A calendar day a payment was made or received, `YYYY-MM-DD`, no time and no zone.
      type: string
      format: date
    PayerName:
      x-audience: request
      description: The name a payment was sent from, as the recipient sees it. Private. NFC, no control characters, no surrounding white space.
      type: string
      minLength: 2
      maxLength: 80
    PublicDonorName:
      x-audience: request
      description: A name a donor chose and agreed to show in the public donor list.
      type: string
      minLength: 2
      maxLength: 60
    DonationAmount:
      x-audience: shared
      description: An amount of money reported, confirmed or corrected, in integer US cents. The bounds of one movement.
      type: integer
      format: int64
      minimum: 1
      maximum: 10000000000
    LocalizedText:
      x-audience: shared
      description: The same text in both languages.
      type: object
      additionalProperties: false
      required: [en, fr]
      properties:
        en: { type: string }
        fr: { type: string }
    PaymentDetailsId:
      x-audience: shared
      description: Identifier of one published version of a method's recipient details. A gift keeps the version that was shown when it was reported.
      type: string
      pattern: '^pmd_[A-Za-z0-9]{22}$'
    RecipientField:
      x-audience: shared
      description: One recipient detail shown to the donor. A `link` is an https address the donor opens; a `text` value is shown with a copy button. Never rendered as HTML.
      type: object
      additionalProperties: false
      required: [labels, value, format]
      properties:
        labels: { $ref: '#/components/schemas/LocalizedText' }
        value: { type: string, minLength: 1, maxLength: 200 }
        format: { type: string, enum: [text, link] }
    PaymentMethodId:
      x-audience: shared
      description: Stable identifier of a payment method, like a category identifier. Chosen when the method is created, never changed, never reused.
      type: string
      pattern: '^[a-z][a-z0-9_]{1,31}$'
    PaymentMethod:
      x-audience: shared
      description: An active payment method with the recipient details to pay to. Recipient details are public by nature, since a donor must read them before paying.
      type: object
      additionalProperties: false
      required: [id, labels, position, detailsId, instructions, recipient]
      properties:
        id: { $ref: '#/components/schemas/PaymentMethodId' }
        labels: { $ref: '#/components/schemas/LocalizedText' }
        position: { type: integer, minimum: 1 }
        detailsId: { $ref: '#/components/schemas/PaymentDetailsId' }
        instructions: { $ref: '#/components/schemas/LocalizedText' }
        recipient:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/RecipientField' }
    PaymentMethodList:
      x-audience: shared
      description: The active methods in display order. Empty when gifts cannot be reported yet.
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
    DonationState:
      x-audience: shared
      description: |
        The state of a gift. `reported`: a donor said they paid, nothing is verified and
        nothing public changed. `confirmed`: a super administrator verified receipt; one
        `donation` ledger entry exists. `rejected`: the report cannot be confirmed.
      type: string
      enum: [reported, confirmed, rejected]
    DonationDisplay:
      x-audience: request
      description: |
        How the gift appears publicly once confirmed. `named` needs `publicName` and is the
        donor's consent to show that name; `anonymous` lists the gift without a name; `hidden`
        counts it in totals but does not list it. No picture: a guest has none.
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [named, anonymous, hidden] }
        publicName: { $ref: '#/components/schemas/PublicDonorName' }
    DonationReportRequest:
      x-audience: request
      description: |
        A gift reported by a donor. It can carry no state, no confirmed amount, no account, no
        permission and no identifier of its own. A text value that is a payment card number is
        refused and never stored.
      type: object
      additionalProperties: false
      required: [caseCode, amount, paymentDetailsId, paidOn, payerName, display]
      properties:
        caseCode:
          description: A public case or `FUND`. Matched case-insensitively. Must accept gifts now.
          type: string
          pattern: '^[A-Za-z]{2,8}(-[0-9]{1,6})?$'
          maxLength: 16
        amount: { $ref: '#/components/schemas/DonationAmount' }
        paymentDetailsId: { $ref: '#/components/schemas/PaymentDetailsId' }
        paidOn: { $ref: '#/components/schemas/PaidDate' }
        payerName: { $ref: '#/components/schemas/PayerName' }
        paymentReference:
          description: Optional. A confirmation number or the handle the payment came from. Private.
          type: string
          minLength: 1
          maxLength: 64
        contact:
          description: Optional. Where the organisers may reach the donor about this gift. Private. The site sends nothing to it.
          type: string
          minLength: 3
          maxLength: 120
        display: { $ref: '#/components/schemas/DonationDisplay' }
    EvidenceUpload:
      x-audience: credential
      description: The one-time capability to attach a screenshot to the gift just reported. Kept in memory only.
      type: object
      additionalProperties: false
      required: [token, expiresAt, maxBytes, formats]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
