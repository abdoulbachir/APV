openapi: 3.1.0
info:
  title: APV-GAKASINAY API
  version: 0.3.0
  summary: Public read endpoints (milestone 0) and identity (milestone 1).
  description: |
    Single source of truth for the API between the APV-GAKASINAY frontend and backend.

    Two groups of endpoints:

    - **Public read** (tags Site, Cases, Case history). No authentication, which is what the
      empty root `security` list states. Unchanged from version 0.2.0.
    - **Identity** (tags Authentication, Account). Sign-up, sign-in, the signed-in person's own
      account, and the second factor for staff. Operations that need a signed-in session say
      so with the `sessionCookie` security requirement.

    Donation reporting, administration, uploads and profile editing are added in later
    milestones through their own contract pull requests. The security rules behind the
    identity endpoints are in `contract/identity-and-security.md`.

    ## Conventions

    - **Base path.** Every path is relative to `/api`. Frontend and API are served from one origin.
    - **Money.** Integer US cents. Never a decimal, never a string. One movement is at most
      10,000,000,000 cents. Every total is at most 1,000,000,000,000,000 cents in absolute
      value, which is inside the JavaScript safe integer range. See
      `contract/financial-terms.md` for the exact meaning of each field and for the bounds.
    - **Timestamps.** RFC 3339 instants in UTC with a `Z` suffix and whole seconds, for example
      `2026-11-21T12:00:00Z`. Clients display them in the browser's local timezone.
    - **Date-only values.** `YYYY-MM-DD` with no time and no zone. Only `deadline` uses this.
      It is a calendar day in the zone named by `deadlineTimezone` on the same case.
    - **Language.** Send `Accept-Language`. Supported languages are `en` and `fr`.
      The response carries `Content-Language` and `Vary: Accept-Language`.
      See the `AcceptLanguage` parameter for the fallback rules.
    - **Errors.** Every error uses the `Error` schema. Clients decide what to show from
      `error.code`. `error.message` is English text for developers.
    - **Privacy.** Schemas in this file are public. They never contain draft cases, private
      beneficiary details, hidden donors, or names and pictures of anonymous donors. Every
      object schema is closed (`additionalProperties: false`): a server response with a
      property that is not listed here fails contract tests.
    - **Forward compatibility.** Clients must nevertheless ignore object properties they do
      not know, and must not fail on an unknown `LedgerKind` or category identifier. Use
      `allocatedDelta` and `deliveredDelta` to compute totals.
    - **Pictures.** Every picture address is a same-origin path under `/media/public/`. It is
      never an absolute URL and never points at another site. See
      `contract/media-and-privacy.md`.
    - **Consistent reads.** Each response is computed from one database snapshot, so the
      totals, breakdown, previews and counts inside one response always agree with each other.
    - **Sessions.** Authentication is a server-side session named by a cookie the browser
      sends by itself. There is no token for the frontend to store. The cookie is `HttpOnly`,
      so scripts cannot read it.
    - **CSRF.** Every request that is not `GET` needs the header `X-CSRF-TOKEN`, whose value
      comes from `GET /auth/csrf`. This includes sign-up and sign-in. The token is tied to
      the server-side session and dies with it. A 403 `csrf_invalid` is decided before the
      operation runs, so nothing was changed. Fetch a new token after any response that
      changes the session.
    - **Request bodies.** Where an operation defines a body: JSON only,
      `Content-Type: application/json`, at most 16 KiB, and a property that is not in the
      schema is refused with field code `unknown_field`, never silently ignored. Where an
      operation defines no body (`POST /auth/logout`, `POST /auth/mfa/enroll`): send none,
      with no `Content-Type` needed; a non-empty body is refused with 400.
    - **Session states.** Each identity operation lists the states it accepts in
      `x-session-state`: `anonymous`, `mfa_required`, `mfa_enrollment_required`,
      `authenticated`. Called in another state it answers, always the same way: 401 with
      the state's code when more sign-in is owed, 409 `already_signed_in` when the session is
      fully signed in and the operation is for one that is not, 403 `forbidden` when a pending
      session calls the other pending state's operation.
    - **What a 401 means.** The code says which of two different things happened, and
      clients must not treat them alike. `unauthenticated`, `mfa_required` and
      `mfa_enrollment_required` describe the session: it is missing, lost, or still owes a
      second factor. `invalid_credentials` and `mfa_code_invalid` describe only the secret
      sent with this request: it was wrong, and the session is exactly as it was before.
      A lost session is never reported with one of the last two, and a wrong password or code
      is never reported with one of the first three, except that the fifth wrong code of a
      pending sign-in ends it and is `unauthenticated`.
    - **After `csrf_invalid`.** Fetch a new token and read `GET /me`. Never send a refused
      `POST` again by itself: the person submits again. A `GET` may be repeated.
    - **Identity headers.** Every answer of an identity operation, errors included, is
      `Cache-Control: no-store`. Every 405 has `Allow`. Every 429 and every identity 503 has
      `Retry-After`.
    - **Caching.** Public read responses are `Cache-Control: no-cache` with an `ETag` and never
      depend on who is asking. Every identity response is `Cache-Control: no-store` and has no
      `ETag`.
    - **401 and 403.** A request that needs a session and has none gets 401, never a redirect
      and never HTML. A signed-in request that is not permitted gets 403. A known path with
      an unsupported method gets 405 with an `Allow` header; this deliberately replaces the
      404 that milestone 0B answered in that case. An unknown path still gets 404. Successful
      public read responses are unchanged.
    - **Audiences.** Every schema declares `x-audience`. `public` and `shared` schemas may
      appear in public read responses. `account` schemas hold the signed-in person's own data.
      `request` schemas are sent by the client and never returned. `credential` schemas carry
      a one-time secret and are returned only by the operations named for it.
      `npm run validate` enforces these boundaries.
    - **Ordering of text.** Case codes and identifiers contain ASCII characters only. Wherever
      this contract orders by `code` or `id`, strings are compared character by character
      with no locale rules (PostgreSQL `COLLATE "C"`, JavaScript `<`, never `localeCompare`).
      `HELP-10` therefore sorts before `HELP-9`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin as the frontend.
security: []
tags:
  - name: Authentication
    description: Sign-up, sign-in, sign-out, CSRF token, second factor and one-time credentials.
  - name: Account
    description: The signed-in person's own account.
  - name: Site
    description: Settings and platform-wide totals.
  - name: Cases
    description: The public case directory, single cases and the general fund.
  - name: Case history
    description: Paginated updates, donors and ledger entries of one case.
paths:
  /site:
    get:
      tags: [Site]
      operationId: getSite
      summary: Site settings the frontend needs to display data correctly.
      description: |
        Not localized: category labels are returned in both languages, so the client can
        switch language without asking again.

        `categories` holds every active category, plus every inactive category that at least
        one public case still uses, ordered by `position` ascending then `id` ascending.
        A category used only by draft cases is not listed.
      responses:
        '200':
          description: Site settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
              example:
                timezone: America/Chicago
                currency: USD
                locales: [en, fr]
                defaultLocale: en
                categories:
                  - { id: education, labels: { en: Education, fr: Éducation }, position: 1, active: true }
                  - { id: medical, labels: { en: Medical, fr: Santé }, position: 2, active: true }
                  - { id: housing, labels: { en: Housing, fr: Logement }, position: 3, active: true }
                  - { id: family, labels: { en: Family, fr: Famille }, position: 4, active: true }
                  - { id: emergency, labels: { en: Emergency, fr: Urgence }, position: 5, active: true }
                  - { id: other, labels: { en: Other, fr: Autre }, position: 6, active: true }
                  - { id: food, labels: { en: Food, fr: Alimentation }, position: 7, active: true }
                  - { id: transport, labels: { en: Transport, fr: Transport }, position: 8, active: false }
                fundCode: FUND
                pagination: { defaultPageSize: 12, maxPageSize: 48 }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /stats:
    get:
      tags: [Site]
      operationId: getStats
      summary: Platform-wide totals.
      description: |
        Internal transfers between cases and the general fund never change these numbers.
      responses:
        '200':
          description: Platform totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
              example:
                received: 102500
                delivered: 55000
                available: 47500
                peopleHelped: 2
                asOf: '2026-11-24T12:00:00Z'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: Search, filter, sort and page through public cases.
      description: |
        Returns cases of kind `case` only. The general fund is never in this list; read it with
        `GET /cases/FUND`. Draft cases are never returned.

        ## Status groups

        - `active` returns cases whose status is `active` or `funded`.
        - `completed` returns cases whose status is `delivered` or `closed`.

        This grouping is the working proposal and still needs the project owner's confirmation.

        ## Category filter (`category`)

        A category identifier from `GET /site`. An inactive category is still a valid filter,
        so old links keep working; the frontend simply does not offer it in its filter list.
        An identifier that does not exist returns 400 `validation_error` with field code
        `invalid_value`.

        ## Search (`q`)

        Length limits, counted in Unicode code points (JavaScript `[...q].length`, Java
        `codePointCount`), never in UTF-16 units or bytes:

        1. The raw value is at most 200 code points.
        2. After trimming, it is at most 80 code points.

        A value over either limit returns 400 `validation_error` with field code `too_long`.
        It is never silently cut. The limit is checked before normalization.

        Both the query and the searched fields are then normalized the same way:

        1. Unicode NFD decomposition.
        2. Remove code points U+0300 to U+036F (combining marks).
        3. Lower-case with the locale-independent Unicode mapping (JavaScript `toLowerCase()`,
           Java `toLowerCase(Locale.ROOT)`).
        4. Trim leading and trailing white space.

        "White space" in trimming means exactly the ECMAScript `trim` set: U+0009 to U+000D,
        U+0020, U+00A0, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F, U+3000 and
        U+FEFF. White space inside the text is kept as it is.

        A case matches when the normalized query is a substring of at least one of: the English
        title, the French title, the public name, the case code. Each field is tested on its
        own. Both languages are searched whatever `Accept-Language` says. Category labels are
        not searched; use `category`. A query that is empty after trimming applies no filter.
        No other folding is applied (for example `œ` does not match `oe`).

        The backend computes the normalized text in application code, not with database
        functions, so the mock and the real API cannot differ.

        ## Sorting

        Every sort ends with the same tie-breakers: `createdAt` descending, then `code`
        ascending by code point. The funding ratio is `max(received, 0) / goal`. Ratios are
        compared exactly by cross-multiplication with arbitrary-precision integers
        (JavaScript `BigInt`, PostgreSQL `numeric`), never with floating point and never with
        64-bit multiplication, which could overflow.

        | `sort` | Order |
        |---|---|
        | `newest` | `createdAt` descending. |
        | `deadline` | `deadlineEndsAt` ascending. Cases with no deadline last. |
        | `closest` | First, cases with a goal that are below it, ratio descending. Then cases at or above their goal, ratio ascending. Then cases with no goal. |
        | `least` | Cases with a goal, ratio ascending. Then cases with no goal. |
        | `featured` | `featuredRank` ascending. Cases with no rank last, in `newest` order. |

        ## Paging

        A `page` beyond the last page is not an error: it returns an empty `items` array with the
        correct totals.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          schema: { type: string, enum: [active, completed], default: active }
        - name: q
          in: query
          description: Search text. See the limits above.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          description: Omit for all categories.
          schema: { $ref: '#/components/schemas/CategoryId' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, deadline, closest, least, featured], default: newest }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of cases.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePage' }
              example:
                items:
                  - code: HELP-904
                    kind: case
                    status: active
                    acceptingDonations: true
                    category: food
                    featuredRank: null
                    title: Groceries for a month
                    titleLanguage: en
                    publicName: Sample household D
                    story: Fictional sample story in a category added after launch.
                    storyLanguage: en
                    photoUrl: null
                    photoThumbnailUrl: null
                    photoAlt: null
                    photoAltLanguage: null
                    goal: 60000
                    received: 0
                    delivered: 0
                    deadline: '2027-03-14'
                    deadlineTimezone: America/Chicago
                    deadlineEndsAt: '2027-03-15T05:00:00Z'
                    createdAt: '2026-11-15T15:00:00Z'
                page: 1
                pageSize: 1
                totalItems: 2
                totalPages: 2
        '400': { $ref: '#/components/responses/ValidationError' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}:
    get:
      tags: [Cases]
      operationId: getCase
      summary: One public case, or the general fund, with previews of its history.
      description: |
        `updates`, `donors` and `ledger` hold the 10 newest entries of each. `counts` holds the
        full number of entries. Older entries are read from the three history endpoints, so the
        complete financial record of a case is always reachable.

        Everything in the response comes from one database snapshot taken at `asOf`.

        A draft case, or a code that does not exist, returns 404 `case_not_found`. The two are
        indistinguishable on purpose.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The case.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
              example:
                case:
                  code: HELP-901
                  kind: case
                  status: active
                  acceptingDonations: true
                  category: education
                  featuredRank: 1
                  title: School supplies for a new term
                  titleLanguage: en
                  publicName: Sample household A
                  story: Fictional sample story.
                  storyLanguage: en
                  photoUrl: /media/public/Zk3vQ9xT1bLw7RmN2cYp4A/display.webp
                  photoThumbnailUrl: /media/public/Zk3vQ9xT1bLw7RmN2cYp4A/thumb.webp
                  photoAlt: Symbolic artwork of a school bag
                  photoAltLanguage: en
                  goal: 100000
                  received: 38500
                  delivered: 30000
                  deadline: '2027-01-18'
                  deadlineTimezone: America/Chicago
                  deadlineEndsAt: '2027-01-19T06:00:00Z'
                  createdAt: '2026-10-04T15:00:00Z'
                financials:
                  externalDonations: 28500
                  transfersIn: 10000
                  transfersOut: 0
                  allocated: 38500
                  delivered: 30000
                  available: 8500
                  hasShortfall: false
                photos:
                  - id: photo-1
                    url: /media/public/h8Jd2LmQ5sXc0VbN6tYu1E/display.webp
                    thumbnailUrl: /media/public/h8Jd2LmQ5sXc0VbN6tYu1E/thumb.webp
                    alt: Symbolic artwork of notebooks
                    altLanguage: en
                    position: 1
                updates:
                  - id: U1
                    caseCode: HELP-901
                    text: Sample update written in English only.
                    textLanguage: en
                    photoUrl: null
                    photoAlt: null
                    photoAltLanguage: null
                    date: '2026-11-19T17:30:00Z'
                    author: Sample Admin
                    authorAvatarUrl: null
                donors:
                  - { id: D3, name: null, amount: 3500, date: '2026-11-06T12:00:00Z', avatarUrl: null }
                  - { id: D2, name: Sample Donor Two, amount: 20000, date: '2026-11-05T12:00:00Z', avatarUrl: null }
                ledger:
                  - { id: L11, kind: transfer_in_reversal, amount: 5000, allocatedDelta: -5000, deliveredDelta: 0, date: '2026-11-13T12:00:00Z', label: Received transfer cancelled, corrects: L06, correctedBy: [], correctedAmount: 0, netAmount: 5000, counterpartCaseCode: FUND }
                  - { id: L09, kind: refund, amount: 2500, allocatedDelta: -2500, deliveredDelta: 0, date: '2026-11-12T12:00:00Z', label: Refund to donor, corrects: L03, correctedBy: [], correctedAmount: 0, netAmount: 2500, counterpartCaseCode: null }
                  - { id: L08, kind: refund, amount: 4000, allocatedDelta: -4000, deliveredDelta: 0, date: '2026-11-10T12:00:00Z', label: Refund to donor, corrects: L03, correctedBy: [], correctedAmount: 0, netAmount: 4000, counterpartCaseCode: null }
                  - { id: L07, kind: disbursement, amount: 30000, allocatedDelta: 0, deliveredDelta: 30000, date: '2026-11-09T12:00:00Z', label: Delivered to the beneficiary, corrects: null, correctedBy: [], correctedAmount: 0, netAmount: 30000, counterpartCaseCode: null }
                  - { id: L06, kind: transfer_in, amount: 15000, allocatedDelta: 15000, deliveredDelta: 0, date: '2026-11-08T12:00:00Z', label: Transfer received, corrects: null, correctedBy: [L11], correctedAmount: 5000, netAmount: 10000, counterpartCaseCode: FUND }
                  - { id: L04, kind: donation, amount: 5000, allocatedDelta: 5000, deliveredDelta: 0, date: '2026-11-07T12:00:00Z', label: Confirmed gift, corrects: null, correctedBy: [], correctedAmount: 0, netAmount: 5000, counterpartCaseCode: null }
                  - { id: L03, kind: donation, amount: 10000, allocatedDelta: 10000, deliveredDelta: 0, date: '2026-11-06T12:00:00Z', label: Confirmed gift, corrects: null, correctedBy: [L08, L09], correctedAmount: 6500, netAmount: 3500, counterpartCaseCode: null }
                  - { id: L02, kind: donation, amount: 20000, allocatedDelta: 20000, deliveredDelta: 0, date: '2026-11-05T12:00:00Z', label: Confirmed gift, corrects: null, correctedBy: [], correctedAmount: 0, netAmount: 20000, counterpartCaseCode: null }
                counts: { updates: 1, donors: 2, ledger: 8, photos: 1 }
                asOf: '2026-11-24T12:00:00Z'
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/updates:
    get:
      tags: [Case history]
      operationId: listCaseUpdates
      summary: Updates posted on a case, newest first.
      description: Ordered by `date` descending, then `id` descending by code point.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of updates.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseUpdatePage' }
              example:
                items:
                  - id: U1
                    caseCode: HELP-901
                    text: Sample update written in English only.
                    textLanguage: en
                    photoUrl: null
                    photoAlt: null
                    photoAltLanguage: null
                    date: '2026-11-19T17:30:00Z'
                    author: Sample Admin
                    authorAvatarUrl: null
                page: 1
                pageSize: 12
                totalItems: 1
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/donors:
    get:
      tags: [Case history]
      operationId: listCaseDonors
      summary: Publicly listed donors of a case, newest first.
      description: |
        One entry per confirmed donation whose visibility is `named` or `anonymous` and whose
        net amount is above zero. The net amount is the donation minus every refund and
        reversal recorded against it. Donations with visibility `hidden` are never listed.
        Ordered by `date` descending, then `id` descending by code point.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of donors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDonorPage' }
              example:
                items:
                  - { id: D3, name: null, amount: 3500, date: '2026-11-06T12:00:00Z', avatarUrl: null }
                  - { id: D2, name: Sample Donor Two, amount: 20000, date: '2026-11-05T12:00:00Z', avatarUrl: null }
                page: 1
                pageSize: 12
                totalItems: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /cases/{code}/ledger:
    get:
      tags: [Case history]
      operationId: listCaseLedger
      summary: Every financial movement of a case, newest first.
      description: |
        The complete public financial record. Entries are never edited or removed; a correction
        is a new entry that points at the one it corrects. Ordered by `date` descending, then
        `id` descending by code point.

        For any case, over all pages:

        - the sum of `allocatedDelta` equals `Case.received`;
        - the sum of `deliveredDelta` equals `Case.delivered`.

        ## Reading several pages while money moves

        Paging uses offsets. Each page is its own snapshot, so a movement recorded between two
        requests shifts later entries by one position: a client reading forward can then see
        one entry twice, and its totals no longer match the first page.

        Because the ledger only ever grows, `totalItems` changes whenever anything changed.
        A client that needs an exact reconciliation therefore:

        1. reads `GET /cases/{code}` and keeps `counts.ledger`;
        2. reads every ledger page and checks that `totalItems` equals that number each time;
        3. starts again if it ever differs.

        `correctedBy`, `correctedAmount` and `netAmount` of an older entry change only when a
        new entry is added, so the same check covers them.
      parameters:
        - $ref: '#/components/parameters/CaseCode'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of ledger entries.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Vary: { $ref: '#/components/headers/Vary' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryPage' }
              example:
                items:
                  - { id: L11, kind: transfer_in_reversal, amount: 5000, allocatedDelta: -5000, deliveredDelta: 0, date: '2026-11-13T12:00:00Z', label: Received transfer cancelled, corrects: L06, correctedBy: [], correctedAmount: 0, netAmount: 5000, counterpartCaseCode: FUND }
                  - { id: L09, kind: refund, amount: 2500, allocatedDelta: -2500, deliveredDelta: 0, date: '2026-11-12T12:00:00Z', label: Refund to donor, corrects: L03, correctedBy: [], correctedAmount: 0, netAmount: 2500, counterpartCaseCode: null }
                page: 1
                pageSize: 2
                totalItems: 8
                totalPages: 4
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CaseNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      summary: Obtain the CSRF token to send with every request that is not GET.
      description: |
        Returns the token for this browser's session. Send it in the header named by
        `headerName` on every `POST`.

        The token belongs to the server-side session. A browser with no session gets an
        anonymous one here (the session cookie is set), which holds nothing but the token and
        expires after 30 idle minutes. There is no separate CSRF cookie.

        The token stops being valid whenever the session identifier changes or the session
        ends: sign-in, second-factor verification, completed enrollment, password change,
        sign-out, expiry. Call this again after each of those. After a 403 `csrf_invalid`,
        fetch a new token, read `GET /me`, and let the person submit again: a refused `POST`
        is never sent again automatically (`contract/identity-and-security.md` section 9.1).
      x-returns-credential: true
      responses:
        '200':
          description: The token. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
              example:
                headerName: X-CSRF-TOKEN
                token: 5pZbJ3mQ0cR8sT1uV4wX7yZ9aB2dE6fG
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/options:
    get:
      tags: [Authentication]
      operationId: getAuthOptions
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      summary: What the sign-in screens should offer.
      description: |
        Says whether public sign-up is open on this server. It is closed in production until
        the site can prove who owns an email address. The frontend hides the sign-up form when
        it is closed; the server refuses sign-up either way.
      responses:
        '200':
          description: The options. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthOptions' }
              example:
                registrationOpen: false
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required]
      summary: Create an ordinary donor account.
      description: |
        Always creates a donor. The request has no role or permission property, and sending
        one is refused as an unknown field.

        When sign-up is closed (`GET /auth/options` says so, and it is closed in production
        until the site can prove who owns an address) the answer is 403 `registration_closed`
        and nothing is created.

        When it is open, the answer is the same whether or not the address was already
        registered, and takes the same time: 202 with no account data. No session is created.
        The person then signs in. If an account already existed, it is untouched and its
        password is not changed.

        The address must be sent without surrounding white space; the server does not trim.
        A fully signed-in session gets 409 `already_signed_in`.

        The email address is not verified in this milestone, because the site does not send
        email yet. `emailVerified` stays false.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              email: sample.donor@example.org
              password: correct horse battery staple 42
              displayName: Sample Donor
              locale: en
      responses:
        '202':
          description: The request was accepted. Says nothing about whether an account was created.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
              example:
                status: accepted
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required]
      summary: Sign in with email and password.
      description: |
        A wrong password, an unknown address and a disabled account all give the same 401
        `invalid_credentials`, after the same amount of work.

        On success the session identifier is replaced, so an identifier known before sign-in
        is worthless afterwards. `status` says what the session can do:

        - `authenticated`: signed in. `account` is present.
        - `mfa_required`: the password was right, and this account must now prove its second
          factor with `POST /auth/mfa/verify`. The session has no permission until then.
        - `mfa_enrollment_required`: a staff account that has not set up its second factor.
          It must do so with `POST /auth/mfa/enroll` and `POST /auth/mfa/confirm`. The session
          has no permission until then.

        A session that is already fully signed in gets 409 `already_signed_in` and is left
        untouched: the frontend reads `GET /me` and offers to sign out. A session that was
        waiting for a second factor is discarded and replaced by this sign-in.

        If the answer is lost on the way, do not send the password again blindly: read
        `GET /me`, whose answer says which state the browser is in.

        Fetch a new CSRF token after this call.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: sample.donor@example.org
              password: correct horse battery staple 42
      responses:
        '200':
          description: The password was correct.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example:
                status: authenticated
                account:
                  id: acc_7Yk2mQ9xT1bLw4RmN8cYp3
                  email: sample.donor@example.org
                  emailVerified: false
                  displayName: Sample Donor
                  role: donor
                  permissions: [account.read_own, account.change_password]
                  mfa: { required: false, enrolled: false, recoveryCodesRemaining: null }
                  locale: en
                  createdAt: '2026-11-24T12:00:00Z'
                  session: { idleExpiresAt: '2026-11-24T14:00:00Z', absoluteExpiresAt: '2026-11-25T12:00:00Z' }
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required, authenticated]
      summary: End the current session.
      description: |
        Deletes the session on the server and clears the cookie. Succeeds also when there was
        no session, so it can always be called. Fetch a new CSRF token afterwards.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Signed out.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      x-session-state: [authenticated]
      summary: Change the signed-in person's own password.
      description: |
        Needs the current password. On success every other session of the account is ended,
        and the identifier of this session is replaced. A wrong current password is 401
        `invalid_credentials` and counts toward the account's password rate limit; the session
        stays signed in and nothing else changes. 401 `unauthenticated` means something
        different: there is no signed-in session any more.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example:
              currentPassword: correct horse battery staple 42
              newPassword: an even longer passphrase for 2027
      responses:
        '204':
          description: The password was changed.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/set-password:
    post:
      tags: [Authentication]
      operationId: setPasswordWithCredential
      x-session-state: [anonymous, mfa_required, mfa_enrollment_required]
      summary: Set a password with a one-time credential (staff activation or password reset).
      description: |
        The credential is issued by the operator, expires quickly and works once. It only lets
        its holder choose a password: it does not sign anyone in, and it never replaces the
        second factor. After success every session of the account is ended and the person
        signs in normally.

        A wrong, malformed, expired or already used credential gives the same 400
        `credential_invalid`: any text is accepted by the schema so that its shape reveals
        nothing. A fully signed-in session gets 409 `already_signed_in` and must sign out
        first.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
            example:
              credential: q3Zr8vT1nK5xW0bM7cJ2fH9dL4sP6gY1aE8uR3tV0oI
              newPassword: an even longer passphrase for 2027
      responses:
        '204':
          description: The password was set. Sign in next.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/SetPasswordRejected' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/verify:
    post:
      tags: [Authentication]
      operationId: verifyMfa
      x-session-state: [mfa_required]
      summary: Complete sign-in with the second factor.
      description: |
        Only for a session whose sign-in answered `mfa_required`. Accepts a six-digit code from
        the authenticator application, or one recovery code. A code works once, also when two
        requests send it at the same instant.

        The first four wrong codes answer 401 `mfa_code_invalid`. The fifth ends the pending
        session and answers 401 `unauthenticated`, as does every later call: the person starts
        again with the password. A pending session that has expired (10 minutes) answers 401
        `unauthenticated` too.

        On success the session identifier is replaced again and the session becomes
        `authenticated`. Fetch a new CSRF token afterwards.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
            example:
              method: totp
              code: '492039'
      responses:
        '200':
          description: The second factor was accepted.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedIn' }
              example:
                status: authenticated
                account:
                  id: acc_2Bd5fH8jK1mN4pQ7sT0vW3
                  email: sample.admin@example.org
                  emailVerified: false
                  displayName: Sample Admin
                  role: admin
                  permissions: [account.read_own, account.change_password]
                  mfa: { required: true, enrolled: true, recoveryCodesRemaining: 9 }
                  locale: fr
                  createdAt: '2026-11-24T12:00:00Z'
                  session: { idleExpiresAt: '2026-11-24T12:30:00Z', absoluteExpiresAt: '2026-11-25T00:00:00Z' }
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/MfaCodeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/enroll:
    post:
      tags: [Authentication]
      operationId: beginMfaEnrollment
      x-session-state: [mfa_enrollment_required]
      summary: Start setting up the authenticator application.
      description: |
        Only for a session whose sign-in answered `mfa_enrollment_required`. Returns the secret
        to add to an authenticator application, once. An account has at most one pending
        secret: calling this again, from this tab or another, replaces it, and a code from the
        replaced secret is then refused. Nothing is active until `POST /auth/mfa/confirm`
        succeeds. If the answer is lost on the way, call it again.
      x-returns-credential: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The pending secret. Shown once, never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollment' }
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/APV-GAKASINAY:sample.admin%40example.org?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=APV-GAKASINAY&algorithm=SHA1&digits=6&period=30
                expiresAt: '2026-11-24T12:10:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/confirm:
    post:
      tags: [Authentication]
      operationId: confirmMfaEnrollment
      x-session-state: [mfa_enrollment_required]
      summary: Finish setting up the authenticator application.
      description: |
        Proves the authenticator application works by sending one code from it. On success the
        second factor is active, the session becomes `authenticated` with a new identifier,
        and ten recovery codes are returned, once. Read `GET /me` next, and fetch a new CSRF
        token.

        A wrong code, or a code for a pending secret that expired or was replaced, answers 401
        `mfa_code_invalid`; the pending session is kept, and the person starts again with
        `POST /auth/mfa/enroll`.

        The enrollment window is checked again here. If it has closed, the answer is 401
        `unauthenticated`, the pending session is ended and nothing is activated.

        When several requests confirm at the same instant, exactly one succeeds: one factor
        becomes active and one set of recovery codes exists. Every other request fails and
        receives no codes. Which error it gets depends on what it presents: 409
        `already_signed_in` if it arrives on the session that is now signed in; 403
        `csrf_invalid` or 401 `unauthenticated` if it still carries the token or the session
        identifier from before the rotation; 401 `mfa_code_invalid` if it came from another
        pending session of the same account, whose pending secret no longer exists.

        If the answer is lost on the way, the codes are gone: sign in and replace them with
        `POST /auth/mfa/recovery-codes`.
      x-returns-credential: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaConfirmRequest' }
            example:
              code: '492039'
      responses:
        '200':
          description: The second factor is active. The recovery codes are shown once.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
              example:
                codes:
                  - ABCD-EFGH-JKLM-NPQR
                  - STUV-WXYZ-2345-67AB
                  - CDEF-GHJK-LMNP-QRST
                  - UVWX-YZ23-4567-ABCD
                  - EFGH-JKLM-NPQR-STUV
                  - WXYZ-2345-67AB-CDEF
                  - GHJK-LMNP-QRST-UVWX
                  - YZ23-4567-ABCD-EFGH
                  - JKLM-NPQR-STUV-WXYZ
                  - 2345-67AB-CDEF-GHJK
                generatedAt: '2026-11-24T12:05:00Z'
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/MfaCodeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadySignedIn' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /auth/mfa/recovery-codes:
    post:
      tags: [Authentication]
      operationId: regenerateRecoveryCodes
      x-session-state: [authenticated]
      summary: Replace all recovery codes.
      description: |
        For a fully signed-in staff account. Needs the current password and a fresh code from
        the authenticator application, even though the session is already signed in. Every old
        recovery code stops working. A recovery code cannot be used to obtain new ones.
      x-returns-credential: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryCodesRequest' }
            example:
              currentPassword: correct horse battery staple 42
              code: '492039'
      responses:
        '200':
          description: Ten new recovery codes, shown once.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
              example:
                codes:
                  - ABCD-EFGH-JKLM-NPQR
                  - STUV-WXYZ-2345-67AB
                  - CDEF-GHJK-LMNP-QRST
                  - UVWX-YZ23-4567-ABCD
                  - EFGH-JKLM-NPQR-STUV
                  - WXYZ-2345-67AB-CDEF
                  - GHJK-LMNP-QRST-UVWX
                  - YZ23-4567-ABCD-EFGH
                  - JKLM-NPQR-STUV-WXYZ
                  - 2345-67AB-CDEF-GHJK
                generatedAt: '2026-11-24T12:05:00Z'
        '400': { $ref: '#/components/responses/IdentityValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /me:
    get:
      tags: [Account]
      operationId: getMyAccount
      x-session-state: [authenticated]
      summary: The signed-in person's own account.
      description: |
        The frontend calls this when it loads, to learn whether someone is signed in. The 401
        code says which state the browser is in:

        - `unauthenticated`: nobody is signed in.
        - `mfa_required`: the password was accepted and the second factor is still owed.
        - `mfa_enrollment_required`: a staff account must set up its second factor first.

        `permissions` lists what this account can do with the endpoints that exist today. Use
        it to decide what to show. It is not a security boundary: the server checks every
        request itself.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account. Never cached.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example:
                id: acc_7Yk2mQ9xT1bLw4RmN8cYp3
                email: sample.donor@example.org
                emailVerified: false
                displayName: Sample Donor
                role: donor
                permissions: [account.read_own, account.change_password]
                mfa: { required: false, enrolled: false, recoveryCodesRemaining: null }
                locale: en
                createdAt: '2026-11-24T12:00:00Z'
                session: { idleExpiresAt: '2026-11-24T14:00:00Z', absoluteExpiresAt: '2026-11-25T12:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/IdentityMethodNotAllowed' }
        '429': { $ref: '#/components/responses/IdentityRateLimited' }
        '500': { $ref: '#/components/responses/IdentityInternalError' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-apv_session
      description: |
        The server-side session. Set by `POST /auth/login`, or earlier by `GET /auth/csrf` as an
        anonymous session that only holds the CSRF token. `HttpOnly`, `Secure`,
        `SameSite=Lax`, `Path=/`, no `Domain`. On a developer's machine over plain HTTP the
        cookie is named `apv_session` and is not `Secure`; that form is refused outside the
        development profile.
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: The token from `GET /auth/csrf`. Required on every request that is not `GET`.
      schema: { type: string, minLength: 16, maxLength: 512 }
      example: 5pZbJ3mQ0cR8sT1uV4wX7yZ9aB2dE6fG
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: |
        Preferred language. The server picks the first supported language (`en` or `fr`) in the
        header, honoring quality values and ignoring region subtags (`fr-CA` is `fr`). A missing
        header, or one with no supported language, means `en`.

        Which text can fall back:

        - **Never falls back:** case titles and stories (a case cannot be published without
          both languages, pending owner approval), category labels, ledger labels.
        - **Can fall back:** update text and picture descriptions. When there is no text in
          the chosen language, the other language is returned.
        - **Never translated:** personal names, public names and author names.

        Every localized field has a companion property naming the language actually returned
        (`titleLanguage`, `storyLanguage`, `textLanguage`, `altLanguage`, `photoAltLanguage`),
        so the client can set the HTML `lang` attribute on exactly that text.
      schema: { type: string, default: en }
      example: fr
    CaseCode:
      name: code
      in: path
      required: true
      description: |
        Case code. Matched case-insensitively. Responses always carry the canonical upper-case
        code. `FUND` is the general fund.
      schema: { type: string, pattern: '^[A-Za-z]{2,8}(-[0-9]{1,6})?$', maxLength: 16 }
      example: HELP-014
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
  headers:
    NoStore:
      description: Always `no-store`. The response must not be kept by any cache, and has no `ETag`.
      schema: { type: string, const: no-store }
    Allow:
      description: The methods this path supports.
      schema: { type: string }
    ContentLanguage:
      description: The language chosen for the response, `en` or `fr`.
      schema: { $ref: '#/components/schemas/Locale' }
    Vary:
      description: Always includes `Accept-Language` on localized responses.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthenticated:
      description: |
        Two kinds of 401, told apart by the code.

        About the session: `unauthenticated` when there is no sign-in at all or it was lost,
        `mfa_required` / `mfa_enrollment_required` when a second factor is still owed.

        About the secret in this request only, with the session unchanged: on
        `POST /auth/change-password` and `POST /auth/mfa/recovery-codes`, `invalid_credentials`
        when the password sent to confirm the action is wrong, and on the second of these
        `mfa_code_invalid` when the code is wrong.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unauthenticated, message: Sign-in required, requestId: 5f0c1c9e2b7a4d1f }
    InvalidCredentials:
      description: |
        The address and password do not match an account that can sign in. Deliberately says
        no more. It is about the secret sent, never about the session.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: invalid_credentials, message: Invalid credentials, requestId: 5f0c1c9e2b7a4d1f }
    MfaCodeInvalid:
      description: |
        `mfa_code_invalid`: the code is wrong, expired, already used, or belongs to a replaced
        pending secret. The pending session is kept and the person may try again.
        `unauthenticated`: there is no pending session any more. It expired, the enrollment
        window closed, or this was the fifth wrong code and the pending session has been
        ended. The person starts again with the password.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: mfa_code_invalid, message: Invalid code, requestId: 5f0c1c9e2b7a4d1f }
    Forbidden:
      description: |
        `csrf_invalid` when the CSRF header is missing or does not belong to this session;
        decided before the operation runs, so nothing was changed. `forbidden` when the
        session is not allowed to do this. `registration_closed` on sign-up when it is closed.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: csrf_invalid, message: Missing or invalid CSRF token, requestId: 5f0c1c9e2b7a4d1f }
    AlreadySignedIn:
      description: |
        The session is fully signed in, and this operation is only for one that is not.
        Nothing was changed. Read `GET /me`, and sign out first if another account is meant.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: already_signed_in, message: Already signed in, requestId: 5f0c1c9e2b7a4d1f }
    SetPasswordRejected:
      description: |
        `credential_invalid`: the one-time credential is wrong, malformed, expired or already
        used; all four look the same. `validation_error`: the body or the new password breaks
        the rules.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: credential_invalid, message: Invalid or expired credential, requestId: 5f0c1c9e2b7a4d1f }
    IdentityValidationError:
      description: The request body is invalid. Never cached.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: password is too short
              fields: [{ name: password, code: too_short }]
              requestId: 5f0c1c9e2b7a4d1f
    IdentityRateLimited:
      description: Too many attempts. Wait `Retry-After` seconds; never more than 15 minutes, 60 for sign-up.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Too many requests, requestId: 5f0c1c9e2b7a4d1f }
    IdentityInternalError:
      description: Unexpected server error. Says nothing else.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal_error, message: Unexpected error, requestId: 5f0c1c9e2b7a4d1f }
    IdentityUnavailable:
      description: Temporarily unavailable, including when too many passwords are being checked at once.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unavailable, message: Service unavailable, requestId: 5f0c1c9e2b7a4d1f }
    IdentityMethodNotAllowed:
      description: The path exists and does not support this method.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Allow: { $ref: '#/components/headers/Allow' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: method_not_allowed, message: Method not allowed, requestId: 5f0c1c9e2b7a4d1f }
    MethodNotAllowed:
      description: The path exists and does not support this method.
      headers:
        Allow: { $ref: '#/components/headers/Allow' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: method_not_allowed, message: Method not allowed, requestId: 5f0c1c9e2b7a4d1f }
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unsupported_media_type, message: Content-Type must be application/json, requestId: 5f0c1c9e2b7a4d1f }
    PayloadTooLarge:
      description: The request body is larger than 16 KiB.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: payload_too_large, message: Request body too large, requestId: 5f0c1c9e2b7a4d1f }
    ValidationError:
      description: A query parameter is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: validation_error
              message: pageSize must be between 1 and 48
              fields: [{ name: pageSize, code: out_of_range }]
              requestId: 5f0c1c9e2b7a4d1f
    CaseNotFound:
      description: No public case has this code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: case_not_found, message: Case not found, requestId: 5f0c1c9e2b7a4d1f }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: rate_limited, message: Too many requests, requestId: 5f0c1c9e2b7a4d1f }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: internal_error, message: Unexpected error, requestId: 5f0c1c9e2b7a4d1f }
    Unavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: unavailable, message: Service unavailable, requestId: 5f0c1c9e2b7a4d1f }
  schemas:
    MovementCents:
      x-audience: shared
      description: |
        The amount of one movement, or a goal, in integer US cents. Strictly positive and at
        most 10,000,000,000 (one hundred million dollars).
      type: integer
      format: int64
      minimum: 1
      maximum: 10000000000
    Cents:
      x-audience: shared
      description: |
        A non-negative total in integer US cents. At most 1,000,000,000,000,000, which the
        server guarantees by capping the sum of all movement amounts on the platform.
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000000000
    SignedCents:
      x-audience: shared
      description: |
        A total or a change in integer US cents that can be negative. Negative totals appear
        only in the exceptional shortfall situation described in `contract/financial-terms.md`.
      type: integer
      format: int64
      minimum: -1000000000000000
      maximum: 1000000000000000
    Timestamp:
      x-audience: shared
      description: RFC 3339 instant in UTC, whole seconds, `Z` suffix.
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
    Locale:
      x-audience: shared
      type: string
      enum: [en, fr]
    MediaPath:
      x-audience: shared
      description: |
        Same-origin path of a public picture. Never an absolute URL. The second segment is a
        random token that cannot be guessed; the last is the size variant.
      type: string
      pattern: '^/media/public/[A-Za-z0-9_-]{22,64}/[a-z0-9-]{1,32}\.(webp|jpg|png|avif)$'
    CategoryId:
      x-audience: public
      description: |
        Stable identifier of a category. Chosen when the category is created, never changed
        and never reused. The list of categories is data, not part of this contract: read it
        from `GET /site`.
      type: string
      pattern: '^[a-z][a-z0-9-]{1,31}$'
    Category:
      x-audience: public
      description: |
        A category managed by the super administrator. New categories appear here without any
        change to the application. The frontend keeps its own look for the six initial
        identifiers (`education`, `medical`, `housing`, `family`, `emergency`, `other`) and
        uses a generic look for any other identifier.
      type: object
      additionalProperties: false
      required: [id, labels, position, active]
      properties:
        id: { $ref: '#/components/schemas/CategoryId' }
        labels:
          description: Display label in every supported language. Both are always present.
          type: object
          additionalProperties: false
          required: [en, fr]
          properties:
            en: { type: string, minLength: 1, maxLength: 40 }
            fr: { type: string, minLength: 1, maxLength: 40 }
        position:
          description: Display order, ascending. Unique.
          type: integer
          minimum: 1
        active:
          description: |
            False for a retired category. It still labels the cases that use it and still
            works as a filter value, but the frontend does not offer it in its filter list and
            administrators cannot choose it for a case.
          type: boolean
    CaseKind:
      x-audience: public
      type: string
      enum: [case, fund]
    PublicCaseStatus:
      x-audience: public
      description: |
        Public statuses. `draft` exists only in administration schemas.

        - `active`: published and seeking funding.
        - `funded`: the goal is reached; the help is not necessarily delivered yet.
        - `delivered`: the intended help has been handed over. A case can reach this status
          without ever reaching its goal.
        - `closed`: finalized. Its financial history stays public.

        Whether a case takes new gifts is a separate fact: see `acceptingDonations`.
      type: string
      enum: [active, funded, delivered, closed]
    ErrorCode:
      x-audience: shared
      description: |
        Codes used by the endpoints in this version. Later milestones add codes; clients must
        treat an unknown code as a generic failure for its HTTP status.
      type: string
      enum:
        - validation_error
        - case_not_found
        - not_found
        - rate_limited
        - internal_error
        - unavailable
        - unauthenticated
        - mfa_required
        - mfa_enrollment_required
        - invalid_credentials
        - mfa_code_invalid
        - credential_invalid
        - forbidden
        - csrf_invalid
        - method_not_allowed
        - unsupported_media_type
        - payload_too_large
        - already_signed_in
        - registration_closed
    Error:
      x-audience: shared
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              description: English text for developers. Not for display.
              type: string
            fields:
              description: Present on `validation_error`.
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, code]
                properties:
                  name: { type: string }
                  code:
                    type: string
                    enum: [required, invalid_type, invalid_value, out_of_range, too_long, too_short, invalid_format, unknown_field, compromised, same_as_current]
            requestId:
              description: Identifier to quote when reporting a problem.
              type: string
    Site:
      x-audience: public
      type: object
      additionalProperties: false
      required: [timezone, currency, locales, defaultLocale, categories, fundCode, pagination]
      properties:
        timezone:
          description: |
            IANA name of the organization timezone, used for new deadlines. A case keeps the
            zone its deadline was set in: read `deadlineTimezone` on the case, not this value,
            to interpret an existing deadline.
          type: string
        currency: { type: string, const: USD }
        locales:
          type: array
          items: { $ref: '#/components/schemas/Locale' }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
        categories:
          description: See the operation description for which categories are listed and in what order.
          type: array
          items: { $ref: '#/components/schemas/Category' }
        fundCode: { type: string, const: FUND }
        pagination:
          type: object
          additionalProperties: false
          required: [defaultPageSize, maxPageSize]
          properties:
            defaultPageSize: { type: integer }
            maxPageSize: { type: integer }
    Stats:
      x-audience: public
      type: object
      additionalProperties: false
      required: [received, delivered, available, peopleHelped, asOf]
      properties:
        received:
          description: |
            Net external donations to the whole platform: confirmed donations minus donation
            reversals and refunds. Internal transfers are not counted.
          $ref: '#/components/schemas/Cents'
        delivered:
          description: Net money handed to beneficiaries, disbursements minus disbursement reversals.
          $ref: '#/components/schemas/Cents'
        available:
          description: '`received` minus `delivered`.'
          $ref: '#/components/schemas/SignedCents'
        peopleHelped:
          description: |
            Number of cases of kind `case` whose net `delivered` is above zero. It counts
            cases, not human beings: one case can help a whole household, and one person can
            have two cases. Display wording must say "cases" or equivalent.
          type: integer
          minimum: 0
        asOf:
          description: The instant of the snapshot these totals were computed from.
          $ref: '#/components/schemas/Timestamp'
    Case:
      x-audience: public
      description: Public view of a case or of the general fund.
      type: object
      additionalProperties: false
      required:
        - code
        - kind
        - status
        - acceptingDonations
        - category
        - featuredRank
        - title
        - titleLanguage
        - publicName
        - story
        - storyLanguage
        - photoUrl
        - photoThumbnailUrl
        - photoAlt
        - photoAltLanguage
        - goal
        - received
        - delivered
        - deadline
        - deadlineTimezone
        - deadlineEndsAt
        - createdAt
      properties:
        code:
          description: Canonical upper-case code. `FUND` for the general fund.
          type: string
          pattern: '^[A-Z]{2,8}(-[0-9]{1,6})?$'
        kind: { $ref: '#/components/schemas/CaseKind' }
        status: { $ref: '#/components/schemas/PublicCaseStatus' }
        acceptingDonations:
          description: |
            Whether a new gift can be reported for this case right now. Decided by the server;
            clients must not work it out from `status` or `deadline`. Working rule, pending
            owner confirmation: true when the status is `active` or `funded`, the
            administrator has not paused gifts, and the deadline has not passed.
          type: boolean
        category:
          description: |
            Identifier of the case's category, to be looked up in `GET /site`. Always set for
            kind `case`. Always null for the fund. Can name an inactive category.
          oneOf:
            - $ref: '#/components/schemas/CategoryId'
            - type: 'null'
        featuredRank:
          description: Lower shows first. Null when not featured. Unique among public cases.
          type: [integer, 'null']
          minimum: 1
        title:
          description: Localized.
          type: string
        titleLanguage:
          description: Language of `title` as returned.
          $ref: '#/components/schemas/Locale'
        publicName:
          description: The name the person agreed to show. Never translated. Empty for the fund.
          type: string
        story:
          description: Localized plain text. Paragraphs are separated by a blank line.
          type: string
        storyLanguage:
          description: Language of `story` as returned.
          $ref: '#/components/schemas/Locale'
        photoUrl:
          description: Main picture at display size.
          oneOf:
            - $ref: '#/components/schemas/MediaPath'
            - type: 'null'
        photoThumbnailUrl:
          description: Main picture at card size.
          oneOf:
            - $ref: '#/components/schemas/MediaPath'
            - type: 'null'
        photoAlt:
          description: Localized description of the main picture. Null when there is no picture.
          type: [string, 'null']
        photoAltLanguage:
          description: Language of `photoAlt` as returned. Null when `photoAlt` is null.
          oneOf:
            - $ref: '#/components/schemas/Locale'
            - type: 'null'
        goal:
          description: Null for the fund and for cases with no goal. Never zero.
          oneOf:
            - $ref: '#/components/schemas/MovementCents'
            - type: 'null'
        received:
          description: |
            Net funds allocated to this case: external donations plus transfers in minus
            transfers out, each net of corrections. Equal to `financials.allocated`. Negative
            only in an exceptional shortfall; show the real number and clamp the progress bar
            at zero.
          $ref: '#/components/schemas/SignedCents'
        delivered:
          description: Net money handed over from this case.
          $ref: '#/components/schemas/Cents'
        deadline:
          description: |
            Last calendar day of the appeal, inclusive, in the zone named by
            `deadlineTimezone`. Date only. Format it without any timezone conversion.
          type: [string, 'null']
          format: date
        deadlineTimezone:
          description: |
            IANA zone in which `deadline` is a calendar day: the organization timezone at the
            moment the deadline was set. It is stored with the case, so changing the
            organization timezone later never moves an existing deadline. Null when `deadline`
            is null.
          type: [string, 'null']
        deadlineEndsAt:
          description: |
            The cutoff: the first instant of the day after `deadline` in `deadlineTimezone`
            (exclusive end), computed with that zone's daylight saving rules and stored with
            the case. The same instant for every visitor worldwide. Null when `deadline` is
            null.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          description: When the case was first published.
          $ref: '#/components/schemas/Timestamp'
    CaseFinancials:
      x-audience: public
      description: |
        Breakdown of a case's money. `allocated = externalDonations + transfersIn - transfersOut`
        and `available = allocated - delivered` always hold.
      type: object
      additionalProperties: false
      required: [externalDonations, transfersIn, transfersOut, allocated, delivered, available, hasShortfall]
      properties:
        externalDonations:
          description: Confirmed donations to this case, minus donation reversals and refunds.
          $ref: '#/components/schemas/Cents'
        transfersIn:
          description: Money moved into this case from other cases or the fund, net of reversed transfers.
          $ref: '#/components/schemas/Cents'
        transfersOut:
          description: |
            Money moved out of this case, net of reversed transfers. For the general fund this
            is the net amount allocated to cases. It is not a delivery to a beneficiary.
          $ref: '#/components/schemas/Cents'
        allocated: { $ref: '#/components/schemas/SignedCents' }
        delivered: { $ref: '#/components/schemas/Cents' }
        available: { $ref: '#/components/schemas/SignedCents' }
        hasShortfall:
          description: True when `available` is negative.
          type: boolean
    CasePhoto:
      x-audience: public
      description: An additional public picture of a case.
      type: object
      additionalProperties: false
      required: [id, url, thumbnailUrl, alt, altLanguage, position]
      properties:
        id: { type: string }
        url:
          description: Display size.
          $ref: '#/components/schemas/MediaPath'
        thumbnailUrl: { $ref: '#/components/schemas/MediaPath' }
        alt:
          description: Localized description for screen readers.
          type: string
        altLanguage:
          description: Language of `alt` as returned.
          $ref: '#/components/schemas/Locale'
        position:
          description: 1-based display order.
          type: integer
          minimum: 1
    CaseUpdate:
      x-audience: public
      type: object
      additionalProperties: false
      required: [id, caseCode, text, textLanguage, photoUrl, photoAlt, photoAltLanguage, date, author, authorAvatarUrl]
      properties:
        id: { type: string }
        caseCode: { type: string }
        text:
          description: Localized plain text. Can fall back to the other language.
          type: string
        textLanguage:
          description: Language of `text` as returned.
          $ref: '#/components/schemas/Locale'
        photoUrl:
          oneOf:
            - $ref: '#/components/schemas/MediaPath'
            - type: 'null'
        photoAlt:
          description: Localized description of the picture. Null when there is no picture.
          type: [string, 'null']
        photoAltLanguage:
          oneOf:
            - $ref: '#/components/schemas/Locale'
            - type: 'null'
        date: { $ref: '#/components/schemas/Timestamp' }
        author:
          description: Display name of the administrator who posted it. Never translated.
          type: string
        authorAvatarUrl:
          description: Null unless the author allows public display of their picture.
          oneOf:
            - $ref: '#/components/schemas/MediaPath'
            - type: 'null'
    PublicDonor:
      x-audience: public
      type: object
      additionalProperties: false
      required: [id, name, amount, date, avatarUrl]
      properties:
        id:
          description: Opaque identifier of the listing. Not an account identifier.
          type: string
        name:
          description: Null for an anonymous donation.
          type: [string, 'null']
        amount:
          description: |
            Net amount of the donation: the confirmed amount minus every refund and reversal
            recorded against it. A donation whose net amount is zero is not listed.
          $ref: '#/components/schemas/MovementCents'
        date:
          description: Date of the original donation. Later corrections do not change it.
          $ref: '#/components/schemas/Timestamp'
        avatarUrl:
          description: |
            Null unless the donation is named and the donor has agreed to public display of their
            picture. Always null for an anonymous donation.
          oneOf:
            - $ref: '#/components/schemas/MediaPath'
            - type: 'null'
    LedgerKind:
      x-audience: public
      description: |
        Four original kinds and five correction kinds. A correction always points at exactly
        one original entry of the kind shown.

        | Kind | Effect | Corrects |
        |---|---|---|
        | `donation` | allocated + | |
        | `transfer_in` | allocated + | |
        | `transfer_out` | allocated - | |
        | `disbursement` | delivered + | |
        | `donation_reversal` | allocated - | a `donation` recorded in error |
        | `refund` | allocated - | a `donation` whose money went back to the donor |
        | `transfer_in_reversal` | allocated - | a `transfer_in` |
        | `transfer_out_reversal` | allocated + | a `transfer_out` |
        | `disbursement_reversal` | delivered - | a `disbursement` |
      type: string
      enum:
        - donation
        - donation_reversal
        - refund
        - transfer_in
        - transfer_out
        - transfer_in_reversal
        - transfer_out_reversal
        - disbursement
        - disbursement_reversal
    LedgerEntry:
      x-audience: public
      description: |
        One movement of money on one case. See `contract/financial-terms.md` section 2 for the
        correction rules.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - amount
        - allocatedDelta
        - deliveredDelta
        - date
        - label
        - corrects
        - correctedBy
        - correctedAmount
        - netAmount
        - counterpartCaseCode
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/LedgerKind' }
        amount:
          description: Always positive. The direction is given by `kind` and by the two deltas.
          $ref: '#/components/schemas/MovementCents'
        allocatedDelta:
          description: Signed change to the case's `received`.
          $ref: '#/components/schemas/SignedCents'
        deliveredDelta:
          description: Signed change to the case's `delivered`.
          $ref: '#/components/schemas/SignedCents'
        date:
          description: When the movement took effect.
          $ref: '#/components/schemas/Timestamp'
        label:
          description: Localized, ready to display. Never contains a donor name.
          type: string
        corrects:
          description: |
            Identifier of the original entry this one corrects. Set on the five correction
            kinds, null on the four original kinds. The original is always on the same case.
          type: [string, 'null']
        correctedBy:
          description: |
            Identifiers of every entry that corrects this one, oldest first. Empty when there
            is none. Always empty on a correction entry, because a correction cannot itself be
            corrected.
          type: array
          items: { type: string }
        correctedAmount:
          description: |
            Sum of the amounts of the entries in `correctedBy`. Never more than `amount`. The
            entry is partly corrected when this is between zero and `amount`, and fully
            corrected when it equals `amount`.
          $ref: '#/components/schemas/Cents'
        netAmount:
          description: '`amount` minus `correctedAmount`. What still stands of this movement.'
          $ref: '#/components/schemas/Cents'
        counterpartCaseCode:
          description: |
            On the four transfer kinds, the code of the case or fund at the other end. Null on
            every other kind. The other end is always public, because no money can move to or
            from a draft case.
          type: [string, 'null']
    HistoryCounts:
      x-audience: public
      type: object
      additionalProperties: false
      required: [updates, donors, ledger, photos]
      properties:
        updates: { type: integer, minimum: 0 }
        donors:
          description: Number of publicly listed donors. Hidden donations are not counted.
          type: integer
          minimum: 0
        ledger: { type: integer, minimum: 0 }
        photos: { type: integer, minimum: 0 }
    CaseDetail:
      x-audience: public
      type: object
      additionalProperties: false
